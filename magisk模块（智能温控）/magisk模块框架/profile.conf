# 飞智 B6X 增强计划 — 智能温控配置
# 格式：KEY=VALUE（等号两边不要空格），# 开头为注释，空行自动跳过
# 修改后无需重启 daemon，下一轮 5 秒循环自动热重载

# ======================== 总开关 ========================
# 整个配置文件的全局开关
# =0：不加载以下任何参数，全部使用代码内默认值
# =1：正常加载以下所有参数
CONFIG_ENABLED=0

# [1] 电池温度控制
# 基准温度，电池温度与此值比较算偏差
BATT_BASELINE=350

# 第一区间阈值，|偏差|≤此值时不调整（死区），避免小幅波动频繁换挡
BATT_ZONE_1=7

# 第二区间阈值
# 死区 < |偏差| ≤ 此值 → ±1 档，|偏差| > 此值 → ±2 档
BATT_ZONE_2=20

# 档位变动冷却（每次任意原因导致的档位变动后冻结周期数，×5秒）
# 期内跳过因电池温度触发的常规升降档（峰值反补和紧急干预不受限）
BATT_COOLDOWN_CYCLES=3

# [2] 温度趋势豁免 & 峰值过冲抑制（合并）
# 峰值反补执行后BATT_COOLDOWN_CYCLES周期不再执行常规升降档。

# 最大连续豁免次数（0=关闭豁免，20=最大）
OVERRIDE_MAX=6

# 2°C 内豁免/反补分界阈值（0.1°C）
# 变动 ≤此值 → 趋势豁免，>此值 → 进入反补判断
PEAK_DAMP_INNER_BOUNDARY=3

# 2°C 内反补二级阈值（0.1°C）
# 变动 >PEAK_DAMP_INNER_BOUNDARY 且 ≤此值 → 反补 1 档，>此值 → 反补 2 档
PEAK_DAMP_INNER_THRESHOLD=5

# 2°C 外豁免/反补分界阈值（0.1°C）
# 变动 ≤此值 → 趋势豁免，>此值 → 反补 1 档
PEAK_DAMP_OUTER_THRESHOLD=5

# [4] CPU 温度紧急干预
# CPU 加权温度超过以下阈值时触发紧急等级（配合电流 OR 入 AND 出）
# >85.0°C → 紧急等级 3（强制最低 8 档，固定 5200RPM/155）
CPU_EMERG_3=850
# >75.0°C → 紧急等级 2（强制最低 7 档，固定 4650RPM/130）
CPU_EMERG_2=750
# >65.0°C → 紧急等级 1（强制最低 6 档，固定 4000RPM/100）
CPU_EMERG_1=650

# 降温恢复阈值，带 10°C 滞回防止频繁跳变
# <55.0°C → 清除所有紧急
CPU_RECOVER_0=550
# <65.0°C 且当前≥2 级 → 降为 1
CPU_RECOVER_1=650
# <75.0°C 且当前≥3 级 → 降为 2
CPU_RECOVER_2=750

# CPU 温度一阶低通滤波系数（百分比，1~100）
# weighted = raw × α% + old × (100-α)%，越大越跟原始值，越小越平滑
CPU_FILTER_ALPHA=20

# [5] 电流紧急干预（配合 CPU 温度，OR 入 AND 出）
# 电流读取 /sys/class/power_supply/battery/current_now，取绝对值（充放电都算）
# 不平滑，不滤波，原始值直接比较
# 进入条件：CPU 温度 OR 电池电流其中一个超过阈值即触发
# 退出条件：CPU 温度 AND 电池电流都低于恢复阈值才降级
# 单位：微安（µA），1000000 = 1A
# >7A 进入紧急等级 3（强制最低档位 EMERG_FORCED_3）
CURRENT_EMERG_3=7000000
# >6A 进入紧急等级 2
CURRENT_EMERG_2=6000000
# >5A 进入紧急等级 1
CURRENT_EMERG_1=5000000
# <6A 从等级 3 降为 2
CURRENT_RECOVER_2=6000000
# <5A 从等级 2 降为 1
CURRENT_RECOVER_1=5000000
# <4A 清除所有紧急等级
CURRENT_RECOVER_0=4000000

# 紧急强制最低档位（CPU+电流双源 OR 入 AND 出，退出紧急时也作为档位上限）
# 等级 3 强制最低档（固定 5200RPM/155）
EMERG_FORCED_3=8
# 等级 2 强制最低档（固定 4650RPM/130）
EMERG_FORCED_2=7
# 等级 1 强制最低档（固定 4000RPM/100）
EMERG_FORCED_1=6

# [6] CPU 温度扫描范围（thermal_zone 编号）
# 脚本默认 0~99 全量扫描。以下为 K60 机型推荐值，其他机型请自行测试
CPU_ZONE_MIN=30
CPU_ZONE_MAX=40

# [7] 进程检测
# LSPosed 模块最后一次写 status 文件超过此秒数 → 判进程死
STATUS_TIMEOUT=16

# [8] 日志
# 日志文件路径（空字符串或省略则自动根据二进制名在/cache/目录生成）
LOG_FILE=/cache/tempctrl.log

# 日志文件大小上限（KB），超限自动删除最早日志行，0=关闭日志
LOG_MAX_KB=5


# 档位表独立开关（=0 时忽略下方所有 GEAR_N，使用代码默认档位表）
# =1 时且下方有 GEAR_N 行，档位表完全由此定义（不再使用默认表）
GEAR_CONFIG_ENABLED=0

# 格式：GEAR_<档位N>=<模式>,<目标温度°C>,<风扇RPM>,<制冷强度>（模式0时制冷强度失效，模式1时目标温度无效）
# 范围：N=1~32, 模式=0(智能)或1(固定), 目标=5~35°C, 风扇=2000~6000, 制冷=1~194
# 另外说明：智能温控风扇上限疑似非强制生效，容易导致噪音突增，一般不建议使用

GEAR_10=1,0,6000,190
GEAR_9=1,0,5650,175
GEAR_8=1,0,5200,155
GEAR_7=1,0,4650,130
GEAR_6=1,0,4000,100
GEAR_5=1,0,3350,75
GEAR_4=1,0,2800,55
GEAR_3=1,0,2350,35
GEAR_2=1,0,2000,20
GEAR_1=1,0,2000,10
