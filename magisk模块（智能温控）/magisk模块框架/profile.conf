# 飞智 B6X 增强计划 — 智能温控配置
# 格式：KEY=VALUE（等号两边不要空格），# 开头为注释，空行自动跳过
# 修改后无需重启 daemon，下一轮 5 秒循环自动热重载

# 全局说明：所有温度值的单位都是 0.1°C
# 例：350 = 35.0°C，850 = 85.0°C，7 = 0.7°C

# 挡位表（暂时不可更改，仅作说明用途）
# |档位 |模式 |目标温度|风扇RPM|制冷强度|其他|
# |-----|------|-------|-------|-------|------------|
# | 12  | 固定 |  —  | 6000 | 190  | 制冷峰值 |
# | 11  | 智能 | 12°C | 5800 | auto | 紧急3-min |
# | 10  | 智能 | 13°C | 5500 | auto | |
# |  9  | 智能 | 14°C | 5100 | auto | 紧急2-min |
# |  8  | 智能 | 15°C | 4600 | auto | |
# |  7  | 智能 | 16°C | 4000 | auto | 紧急1-min |
# |  6  | 智能 | 18°C | 3400 | auto | |
# |  5  | 固定 |  —  | 2900 |  80  | |
# |  4  | 固定 |  —  | 2500 |  60  | |
# |  3  | 固定 |  —  | 2200 |  40  | |
# |  2  | 固定 |  —  | 2000 |  20  | |
# |  1  | 固定 |  —  | 2000 |  10  | 伪待机 |


# [0] 配置文件总开关（必须放在第一行，预检时最先读取）
# =0：不加载以下任何参数，全部使用代码内默认值，即本文件默认值（CPU_ZONE除外，默认1-99）
# =1：正常加载以下所有参数
CONFIG_ENABLED=0

# [1] 电池温度控制
# 基准温度，电池温度与此值比较算偏差
BATT_BASELINE=350

# 第一区间阈值，|偏差|≤此值时不调整（死区），避免小幅波动频繁换挡
BATT_ZONE_1=7

# 第二区间阈值
# 死区 < |偏差| ≤ 此值 → ±1 档，|偏差| > 此值 → ±2 档
BATT_ZONE_2=20

# 档位变动冷却（每次任意原因导致的档位变动后冻结周期数，×5秒）
# 期内跳过因电池温度触发的常规升降档（峰值反补和紧急干预不受限）
BATT_COOLDOWN_CYCLES=3

# [2] 温度趋势豁免 & 峰值过冲抑制（合并）
# 峰值反补执行后BATT_COOLDOWN_CYCLES周期不再执行常规升降档。

# 最大连续豁免次数（0=关闭豁免，20=最大）
OVERRIDE_MAX=8

# 2°C 内豁免/反补分界阈值（0.1°C）
# 变动 ≤此值 → 趋势豁免，>此值 → 进入反补判断
PEAK_DAMP_INNER_BOUNDARY=3

# 2°C 内反补二级阈值（0.1°C）
# 变动 >PEAK_DAMP_INNER_BOUNDARY 且 ≤此值 → 反补 1 档，>此值 → 反补 2 档
PEAK_DAMP_INNER_THRESHOLD=5

# 2°C 外豁免/反补分界阈值（0.1°C）
# 变动 ≤此值 → 趋势豁免，>此值 → 反补 1 档
PEAK_DAMP_OUTER_THRESHOLD=5

# [4] CPU 紧急干预
# CPU 加权温度超过以下阈值时触发紧急等级，强制最低档位
# >85.0°C → 紧急等级 3（强制最低 10 档，满功率）
CPU_EMERG_3=850
# >75.0°C → 紧急等级 2（强制最低 8 档，智能 13°C/5500RPM）
CPU_EMERG_2=750
# >65.0°C → 紧急等级 1（强制最低 6 档，智能 16°C/4000RPM）
CPU_EMERG_1=650

# 降温恢复阈值，带 10°C 滞回防止频繁跳变
# <55.0°C → 清除所有紧急
CPU_RECOVER_0=550
# <65.0°C 且当前≥2 级 → 降为 1
CPU_RECOVER_1=650
# <75.0°C 且当前≥3 级 → 降为 2
CPU_RECOVER_2=750

# 紧急强制最低档位（退出紧急时也作为档位上限）
# 等级 3 强制最低档（满功率）
EMERG_FORCED_3=10
# 等级 2 强制最低档（智能 13°C/5500RPM）
EMERG_FORCED_2=8
# 等级 1 强制最低档（智能 16°C/4000RPM）
EMERG_FORCED_1=6

# CPU 温度一阶低通滤波系数（百分比，1~100）
# weighted = raw × α% + old × (100-α)%，越大越跟原始值，越小越平滑
CPU_FILTER_ALPHA=20

# CPU 温度扫描范围（thermal_zone 编号）
# 默认 0~99 全量扫描。以下为 K60 机型推荐值，其他机型请自行测试
CPU_ZONE_MIN=30
CPU_ZONE_MAX=40

# [5] 进程检测
# LSPosed 模块最后一次写 status 文件超过此秒数 → 判进程死
STATUS_TIMEOUT=16

# [7] 日志
# 日志文件路径（空字符串或省略则自动根据二进制名在/cache/目录生成）
LOG_FILE=/cache/tempctrl.log

# 日志文件大小上限（KB），超限自动删除最早日志行，0=关闭日志
LOG_MAX_KB=10
