# 飞智 B6X 增强计划 — 智能温控配置
# 格式：KEY=VALUE（等号两边不要空格），# 开头为注释，空行自动跳过
# 修改后无需重启 daemon，下一轮 5 秒循环自动热重载
# 本文件由 参数定义/gen_params.py 生成，勿手改（手改会被 check_params.py 判红）；设备上的副本可自由修改
# 段标编号与界面分组一致（分组定义见 参数定义/params.def.json）：[0]日志 [1]性能参数 [2]路径与缩放 [3]自动拉起 app [4]界面

# [0] 日志 & 调试
# 调试日志总开关（独立于性能总开关，=1 开启调试分区输出）
DEBUG_ENABLED=0

# 分区开关（仅 DEBUG_ENABLED=1 时生效）
DEBUG_SENSOR=0    # 传感器读数
DEBUG_EXEC=0      # 执行下发
DEBUG_CONN=0      # 连接状态
DEBUG_CONFIG=0    # 配置加载
DEBUG_MAIN=0      # 主循环
DEBUG_PID=0       # PID
DEBUG_LAUNCH=0    # 自动拉起

# [1] 性能总开关
# =1：正常加载所有性能参数
# =0：除 DEBUG_ENABLED / SYSFS_ENABLED / [3]自动拉起 三个独立大类外，全部使用代码内默认值
# 运行中改为 0：已加载的性能参数立即回落代码内默认值，配置文件内容不动，改回 1 即恢复
PERF_ENABLED=0

# [1] 通用参数
# --- 速率限制 ---
# 每 5 秒周期实际值向目标靠拢的最大步长；风扇升/降共用一套步长与防抖，制冷另有独立多值键
# 未完成量下周期继续累积（每周期从当前实际值重算，不从旧目标续算）
# 风扇限速（双值）：每周期最大变化量 50~2000 · 防抖阈值 0~2000，默认 250 50
#   变化量升/降共用同一步长；防抖生效条件：变化量 ≤ 阈值 且 升速时距最高、降速时距最低 ≥ 阈值×1.5，更近则防抖失效
#   阈值 0=关闭防抖
RATE_LIMIT_FAN=250 50

# 制冷强度限速 + 变化死区（三值）：基础值 1~194 · 倍率 1~100 · 死区 1~50
#   升速 = 基础值 + dev × 倍率 / 10，降速 = 基础值 − dev × 倍率 / 10
#   dev = 电池温度 − BATT_BASELINE（有符号）；算出为负 → 取 0 = 禁止该方向
#   死区：目标与回传实际 |差值| < 死区时升降都不下发；距最高/最低制冷 < 死区×2 时死区失效，允许精确到位
RATE_LIMIT_COLD=25 10 3

# --- 断联保留 ---
# 断联保留 PID 状态的周期数（0~30，默认 3 = 15 秒）：断联时长 < N×5 秒时保留积分/误差等状态，输出不跳变
#   超过 N×5 秒或设为 0 → 完整重置并进入待对齐（等真实回传就绪再起步，不用回传值直接起步）
RECONNECT_KEEP_CYCLES=3

# --- PID 参数（本实现仅 PID 单模式）---
# 基准温度（0.1°C，范围 300~500，默认 350=35.0°C）：误差 = (电池温度 − 此值) / 10
BATT_BASELINE=350

# CPU 温度 EMA 平滑系数（%，1~100，默认 25，即 α=0.25）：首次直取，此后按系数平滑；值越大越跟随原始值
CPU_FILTER_ALPHA=25

# 制冷强度 → 风扇转速映射（双值）：起始强度 0~194 · 指数 50~500
#   转速 ∝ n^指数（n = 制冷超出起始强度的比例，指数 = 值/100，150 → 1.50）；指数 >1 时低制冷段风扇更慢
#   制冷低于起始强度时线性外推下限（避开负数底数）
COLD_RPM_MAP=40 150

# 热端线性映射范围（双值：最低温度 最高温度，0.1°C，范围各 200~500，须双值同给）
HOT_RPM_MAP=350 450

# 冷端/热端映射输入（制冷强度 / 热端温度）共用的 EMA 平滑系数（%，1~99，默认 33，即 α=0.33）
#   输入先平滑再进映射，映射输出不再滤波；值越大越跟随原始值，越小越平滑
MAP_INPUT_SMOOTH_ALPHA=33

# 风扇转速范围（三值）：最低转速 1000~6000 · B6X 最高转速 1000~6000 · B7X 最高转速 2000~8000（前两值须同给）
#   B7X 最高转速目前与 B6X 相同，可单独调整
FAN_RPM_RANGE=2000 6000 6000

# 风扇转速取整单位（RPM，1~500，默认 10）：下发转速前就近取整到该单位的整数倍（2044→2040、2045→2050）
FAN_RPM_ROUND_UNIT=10

# --- 热端过温制冷削减 ---
# 热端过温 → 削低制冷上限以保护散热器（三值）：阈值 350~700（0.1°C） · 倍率 1~20 · 冷却周期 0~20（×5 秒）
#   热端 > 阈值 → 单次削减 (热端 − 阈值) × 倍率 / 10：首次削减把上限压到「当前实际制冷值 − 削减量」，
#   之后每次触发在当前上限上继续累减（不回看历史触发值）
#   热端 ≤ 阈值且已有削减 → 上限每次 +「倍率」逐级上爬，封顶配置上限（PID_COLD_RANGE 上限）
#   削减与恢复各自独立冷却 N 个周期；热端数据无效（<0）时保持当前削减量
HOT_DERATE=450 5 5

# [1] PID 控制（单累积器）
# --- 响应增益 ---
# KDP 融合系数（÷1000，1~1000，默认 300）：kdp = 系数/1000 ×（误差 + 速度项×0.33 + CPU 补偿）
#   无记忆；温度未变时沿用上周期 kdp（速度项定义见 PID_SPEED）
PID_KDP=300

# KI 积分升/降速率（双值，均 ÷1000，各 1~1000，默认 20 30）：被积项 ≥0 用升速率、<0 用降速率
#   每周期 积分累积值 += 速率/1000 × 被积项（不乘 dt），并钳制在 [0, 1−kdp] 内（抗 windup）
#   被积项 = ch − 动态目标（ch 见 PID_KDP 公式）
PID_KI_RATE=20 30

# 速度倍率（÷10，0~1000，默认 100=速度×10，0=关闭）：温度变化速度对控制量的权重，同时进入积分与 KDP；越大越跟手，过大易抖
PID_SPEED=100

# 速度非线性阈值 L（÷100，10~100，默认 20 = 0.20 °C/周期）：速度幅度 ≥ L 完全跟随（1:1），< L 按幂曲线降权
#   v 为温度速度项（倍率见 PID_SPEED）；L 越小、被降权的速度越多
PID_SPEED_NL_THR=20

# 速度非线性强度 q（÷100，0~400，默认 100 = 1.00）：0 = 完全线性（不降权，等价于关闭），越大降权越狠
PID_SPEED_NL_EXP=100

# --- 动态目标 ---
# 三值：目标系数 ÷1000 [1~1000] · 目标 EMA 平滑 % [1~100] · 目标上限（0.1°C）[1~100]
#   动态目标 = clamp(误差 × 系数/1000, ±上限)；平滑值越小越平稳，上限默认 15=1.5°C
#   第 2 值仅在 PID_TARGET_DIR 开关=0 时生效
PID_TARGET=20 10 15

# --- 稳态冻结 ---
# 稳态冻结阈值（1~100，0.1°C，默认 2=0.2°C）：温度未变且上次 |ch| ≤ 阈值/10 时整轮冻结
#   冻结范围：积分/KDP/动态目标/上次 ch 全不更新，仅更新 CPU 补偿的比对基准（防冻结死锁）
PID_CH_THRESHOLD=2

# --- 输入补偿（始终生效）---
# 三值：平滑系数 1~100 · 除数 5~200 · 偏移量 0~500（0.1°C）
#   补偿 = clamp(CPU 平滑温度 − 电池温度 − 偏移量, 0) ÷ (除数 × 10)，再按平滑系数做 EMA
#   门控滞回：CPU 高于电池+偏移时进入补偿；条件消失后平滑值向 0 收敛，归零才退出
PID_CPU_COMP=25 30 100

# --- 动态目标方向性滤波（仅 PID 生效）---
# 三值：开关 · 远离基线 α% [1~100] · 回归基线 α% [1~100]
#   目标量级增大（|原始目标| 超过当前平滑目标）时用「远离 α」求快，否则用「回归 α」求稳
#   默认 1 20 10 = 远离 0.2、回归 0.1；开关=0 时退回 PID_TARGET 第 2 值的单一 α
PID_TARGET_DIR=1 20 10

# --- 无变化回溯（仅 PID 生效）---
# 两值：开关 · 速度权重 ÷1000 [100~1000]，默认 1 1000 = 开启、注入全量速度
#   温度未变（本周期无新样本）时，用最近一次变化前的温度作锚点算速度
#   v = (当前温度 − 锚点温度) ÷ 累计周期数 ÷ 10 × 权重/1000，不再额外限幅
PID_SPEED_RECALL=1 1000

# --- 输出范围 ---
# 制冷强度范围（三值）：下限 0~194 · B6X 上限 0~194 · B7X 上限 1~255（前两值须同给）
PID_COLD_RANGE=1 190 190

# --- 冷值动态倍率（四键；配置值均为整数，小数一律 ×100 换算进内部）---
# 冷值越高越难维持 → 按冷值给 PID 增益降倍率（调 PID 增益，不调风扇转速；与 COLD_RPM_MAP 分工不同，可并存）
# 一、输入轴三点（冷值码，零换算；默认 40 100 190）
#   取上次 PID 重算的目标冷值；低于下界不干预，下界→拐点→上界两段线性，上界处取到最大降幅
#   各值 0~255
PID_COLD_DYN_IN=40 100 190

# 二、输出轴拐点降幅（正数 ×100；默认 50 = 0.50）
#   配置里存正数（默认 50 = 降幅 0.5）；两端固定：下界处 0（不干预）、上界处 100（= 1.00）
#   范围 0~100（= 0.00~1.00）
PID_COLD_DYN_OUT=50

# 三、作用点权重（三值：KDP / KI 升 / KI 降，各 ×100；默认 100 100 100 = 1.00）
#   三个作用点各乘自己的权重；0 = 该处不受本机制影响（等效关闭）
#   各值 0~200（= 0.00~2.00）
PID_COLD_DYN_W=100 100 100

# 四、映射参数（两值：倍率上界 U ×100 · 形状指数 γ ×100；默认 200 100 = 2.00 / 1.00）
#   倍率 = U^(sign(s)×|s|^γ)：s=±1 → U 与 1/U（上下界互为倒数）；γ>1 中间更平、两端更陡，γ=1 时即 U^s
#   U 范围 100~400（= 1.00~4.00）；γ 范围 10~400（= 0.10~4.00）
PID_COLD_DYN_MAP=200 100

# [2] 路径与缩放（独立大类：SYSFS_ENABLED=1 时加载，独立于性能总开关）
# 传感器 sysfs 路径，不同机型可能位置不同，可自行修改
# 缩放系数（DIVISOR）：内部值 = 原始值 ÷ 系数（电池温度、CPU 温度各一个），内部单位为 0.1°C
# 以下为 K60 机型推荐值，其他小米系一般通用，其他品牌请自行测试
# 运行中改为 0：已加载的路径与缩放系数立即回落代码内默认值，配置文件内容不动，改回 1 即恢复
SYSFS_ENABLED=0

# 电池温度
BATT_TEMP_PATH=/sys/class/power_supply/battery/temp
BATT_TEMP_DIVISOR=1    # 范围1~10000

# 电池电流（当前版本未参与控制，仅解析保留；原始值 µA ÷ 系数 = 0.01A）
BATT_CURRENT_PATH=/sys/class/power_supply/battery/current_now
BATT_CURRENT_DIVISOR=10000    # 范围1~100000

# CPU 温度（%d 会替换为目标 thermal_zone 编号）
CPU_TEMP_PATH_FMT=/sys/class/thermal/thermal_zone%d/temp
CPU_TEMP_DIVISOR=100    # 范围1~10000

# CPU thermal_zone 首次扫描范围（双值，各 0~99，须双值同给；后续只扫命中的 zone）
#   缩小范围可加速首次扫描，K60 机型推荐 30~40
CPU_ZONE=0 99

# 有效 zone 名单与重扫（双值）：重扫间隔 5~3600（秒） · 保留个数 1~64，默认 60 10
#   首次真全量扫描建立有效 zone 名单（排除初值 ≤0）；此后每「重扫间隔」秒在名单内重排，保留温度最高的 N 个
CPU_ZONE_RESCAN=60 10

# 日志文件路径（SYSFS_ENABLED=1 时加载；空则自动按二进制名在应用私有目录生成）
LOG_FILE=/data/data/com.example.waspwingtempctrl/files/tempctrl.log

# 日志文件大小上限（字节，0~1048576，需 SYSFS_ENABLED=1）：0=关闭日志；超限时截断保留尾部并从完整行首起
LOG_MAX=16256

# [3] 自动拉起 app（独立于性能总开关，任何模式都生效）
# =1：断联或无散热器 app 存活时，自动拉起上次使用的 app（目标已运行/未安装则跳过；拉起后自动后台化，但依旧会闪烁一下界面）；=0：关闭（默认，需在界面中开启）
APP_LAUNCH_ENABLED=0

# 拉起冷却间隔（秒，0~3600，默认 60）：两次拉起的最小间隔，防断连频繁拉起；0=不冷却
APP_LAUNCH_COOLDOWN=60

# 屏幕状态门禁（二值）：开关 · Dozing 是否算亮屏
#   仅 mWakefulness=Awake 才拉起，灭屏/息屏跳过并每 5 秒重试
#   默认 1 0 = 开启、Dozing 不算亮屏；屏幕状态读取失败一律按「可拉起」兜底（防探测失败死锁）
APP_LAUNCH_SCREEN_GATE=1 0

# 散热器锁死自动重启（watchdog，独立于性能总开关，任何模式都生效）
# 停滞次数（0~120，默认 6，0=关闭）：实际制冷停滞（=上周期实际）且未达目标（≠上周期下发）连续 N 次下发 → kill app 并重新拉起
#   前置条件 APP_LAUNCH_ENABLED=1；自动拉起关闭时运行时强制置 0（不改配置文件）
APP_WATCHDOG=6

# [4] 界面（仅界面读取，守护进程忽略）
# 断联（双值）：判定阈值 1~120（秒） · 空白最大宽度 1~600（秒）
#   相邻采样时间差超过第一值视为一次断联、曲线在该处断开；断联空白按真实断开时长等比显示，超过第二值封顶
UI_GAP_SEC=5 15

# 标注合并阈值（px，1~40，默认 9=0.8×标签高）：两条及以上曲线头部垂直相距不超过此值时合并为一个标签行
UI_LABEL_MERGE_PX=9

# 纵轴风扇转速下限（RPM，0~8000，默认 3000）：风扇转速低于此值的样本不参与左轴上下限计算，该段画到图外；过滤后左轴无有效数据时退回不过滤；0=关闭过滤
UI_RPM_AXIS_MIN=3000

# 曲线滤波（双值，均 ×100）：每遍权重 α 0~100 · 最小步长 0~100，默认 15 5 = 0.15 / 0.05
#   热端与电池两条曲线共用这一对参数；零相位双向 EMA + 最小步长格点吸附
#   α = 0 或 100 都视为关闭滤波（100 = 1.0 = 恒等）；最小步长 = 0 视为关闭格点吸附
UI_CURVE_FILTER=15 5

# 返回隐藏后台（0/1，默认 1）：关闭则返回键恢复系统默认退出
#   本组唯一被守护进程读取的键：写入 /data/local/tmp/tempctrl_uiprefs 供钩子读取
UI_BACK_HIDE=1    # 返回隐藏后台

# 默认页面（status|config|log，默认 config）：进入界面时默认显示的页面，界面按 options 给出的取值域渲染
UI_START_PAGE=config

# 需重新部署时进状态页（0/1，默认 1）：需重新部署时先进入状态页并给出提示；关闭则照常进入默认页面
UI_DEPLOY_ENTRY=1
