# 飞智 B6X 增强计划 — 智能温控配置
# 格式：KEY=VALUE（等号两边不要空格），# 开头为注释，空行自动跳过
# 修改已有键的值：下一轮 5 秒循环自动热重载（CPU_ZONE 区间同样热生效，无需重启）
# CPU_TEMP_PATH_FMT / CPU_ZONE_RESCAN 在下次重扫 CPU 温度分区时生效
# 删行恢复默认需重启守护进程
# 设备上的副本可自由修改；仓库内的源文件由生成脚本产出，请勿手改
# 单位标记（勿删）：cfg-unit: CPU_ZONE_RESCAN=cycles
# 段标：[0]日志 [1]性能参数 [2]接口与外围 [3]拉起应用 [4]界面

# [0] 日志调试
# 调试日志（独立于性能总开关，=1 解锁调试分区输出）
#   本开关只解锁分区：各分区默认 0，需单独开启；只开总开关不会产生任何 [DEBUG] 分区日志（配置加载本身仍会记一行「调试日志 开启」）
DEBUG_ENABLED=0

# 分区开关（仅调试日志（DEBUG_ENABLED） 开启时生效）
DEBUG_SENSOR=0    # 传感器读数
DEBUG_EXEC=0      # 执行下发
DEBUG_CONN=0      # 连接状态

# 只用于排查配置拼写（需先开启调试日志（DEBUG_ENABLED））
# 打开后会输出配置里无法识别的键名；以 DEBUG_ 开头的拼错键不会被这里报出（请以界面的「未定义键」提示为准）
# 性能总开关关闭时，普通键的未识别信息也不输出；配置加载的其它日志始终输出，不受本开关控制
DEBUG_CONFIG=0    # 配置加载
DEBUG_MAIN=0      # 主循环
DEBUG_PID=0       # PID
DEBUG_LAUNCH=0    # 自动拉起

# [1] 性能总开关
# =1：正常加载所有性能参数
# =0：除调试日志（DEBUG_ENABLED）/ 外围开关（SYSFS_ENABLED）/ 自动拉起 app 三个独立大类外，全部使用内置默认值
# 运行中改为 0：已加载的性能参数立即回落内置默认值，配置文件内容不动，改回 1 即恢复
PERF_ENABLED=0

# [1] 通用参数
# --- 速率限制 ---
# 每个控制周期（5 秒）实际值向目标靠拢的最大步长；风扇升/降共用一套步长与防抖，制冷另有独立多值键
# 每个控制周期从当前实际值向目标最多走一步；未走完的差额下一个控制周期继续走（不按旧目标叠加）
# 风扇限速（三值）：每控制周期最大变化量 50~2000 · 防抖阈值 0~2000 · 转速取整单位 1~500，默认 250 50 10
#   变化量升/降共用同一步长；防抖生效条件：变化量 ≤ 阈值 且 升速时距最高、降速时距最低 ≥ 阈值×1.5（向上取整），更近则防抖失效
#   阈值 0=关闭防抖
#   阈值同时是停步距离：风扇会停在距目标 ≤ 阈值 RPM 处；阈值应明显小于每控制周期最大变化量，否则可能停得离目标很远（阈值 ≥ 变化量时几乎不动，仅贴近端点可继续）
#   转速取整单位：下发转速前就近取整到该单位的整数倍（默认 10：2044→2040、2045→2050），取整后仍钳制在风扇范围内
RATE_LIMIT_FAN=250 50 10

# 制冷限速 + 变化死区（三值）：基础步长（档位/控制周期）1~194 · 倍率 1~100 · 死区 1~50；死区豁免有方向（升看距上限、降看距下限）
#   升速 = 基础步长 + 温差 × 倍率 / 10，降速 = 基础步长 − 温差 × 倍率 / 10
#   温差 = 电池温度 − 基准温度（有符号）；算出为负 → 取 0 = 禁止该方向。临界温度 = 基准 ± 10×基础步长/倍率（默认约 32.5/37.5°C），改基础步长/倍率/基准后会移动
#   死区：目标与回传实际 |差值| < 死区时升降都不下发；豁免有方向——要升只看距上限、要降只看距下限，该方向余量 < 向上取整(死区×1.5) 时死区失效、允许精确到位
RATE_LIMIT_COLD=25 10 3

# --- 断联保留 ---
# 断联保留 PID 状态的控制周期数（0~30，默认 3 = 15 秒）：断联时长 < N×5 秒时保留积分/误差等状态，并沿用内存中的实际值，输出不跳变
#   达到或超过 N×5 秒、或设为 0 → 完整重置并进入待对齐（等真实回传就绪再起步，不用回传值直接起步）
RECONNECT_KEEP_CYCLES=3

# --- PID 参数（本实现仅 PID 单模式）---
# 基准温度（0.1°C，范围 300~500，默认 350=35.0°C）：误差 = (电池温度 − 此值) / 10
#   本值同时决定制冷限速的禁升/禁降临界点（临界温度 = 本值 ± 10×基础步长÷倍率）；调高更晚加大制冷（更省电、更热），调低更早制冷，两个临界点一起移动
BATT_BASELINE=350

# CPU 温度指数平滑系数（%，1~100，默认 25，即每次取 25% 新值）：首次直取，此后按系数平滑；值越大越跟随原始值
CPU_FILTER_ALPHA=25

# 制冷强度 → 风扇转速映射（双值）：起始强度 0~194 · 指数 50~500
#   转速 = 最低转速 + 比例^指数 ×（当前设备最高转速 − 最低转速）（比例 =（当前制冷强度 − 起始强度）÷（制冷上限 − 起始强度），指数 = 值/100，150 → 1.50）；指数 >100 时低制冷段风扇更慢，100=线性，<100 低冷更快
#   起始强度必须小于制冷上限（制冷范围（PID_COLD_RANGE）的上限，默认 190）；≥ 上限时制冷映射整段失效（映射输出 0）
#   制冷低于起始强度时线性外推下限（避开负数底数）
#   映射端点 = 转速范围的最低/当前设备最高；制冷上限是比例的分母，改上限会改变曲线斜率；最终转速还会与热端映射按 RPM 加权平均（热端无效时只用制冷映射）
COLD_RPM_MAP=40 150

# 热端映射（双值）：最低温度 · 最高温度，0.1°C，范围各 200~500，须双值同给
#   最低温度必须小于最高温度；否则热端映射不参与，风扇只按制冷映射计算
#   映射到 [最低转速, 当前设备最高转速]；降温侧约 1°C 滞回；最终转速与制冷映射按 RPM 加权平均（热端无效时只用制冷映射）
HOT_RPM_MAP=350 450

# 映射输入（制冷强度 / 热端温度）共用的指数平滑系数（%，1~99，默认 33，即每次取 33% 新值）
#   输入先平滑再进映射，映射输出不再滤波；值越大越跟随原始值，越小越平滑
MAP_INPUT_SMOOTH_ALPHA=33

# 转速范围（三值）：最低转速 1000~6000 · B6X 最高转速 1000~6000 · B7X 最高转速 2000~8000（最低转速与最高转速(B6X) 必须同时给；最高转速(B7X) 可省略）
#   最低转速必须小于两个最高转速；否则转速会卡在最高值附近、不再按曲线正常调节（可能来回跳）
#   最高转速(B7X) 省略时沿用上次值（首次为 6000）
#   B7X 最高转速目前与 B6X 相同，但可单独设不同值（仍需把最低转速与最高转速(B6X) 一起写出）
FAN_RPM_RANGE=2000 6000 6000

# --- 过温削减 ---
# 热端过温 → 削低制冷上限以保护散热器（三值）：阈值 350~700（0.1°C） · 倍率 1~20 · 冷却后/恢复后等待周期数 0~20（1 控制周期 = 5 秒；0 = 不冷却，每个控制周期都可触发）
#   热端温度 > 阈值 → 单次削减 (热端温度 − 阈值) × 倍率 / 10：首次削减把上限压到「当前实际制冷值 − 削减量」，
#   之后每次触发在当前上限上继续累减（不回看历史触发值）
#   热端温度 ≤ 阈值且已有削减 → 上限每次 +「倍率」逐级上爬，封顶配置上限（制冷范围（PID_COLD_RANGE）的上限）
#   削减与恢复各自独立冷却 N 个控制周期（0 = 不冷却，每个控制周期都可触发，最激进）；热端数据无效（<0）时保持当前削减量
HOT_DERATE=450 5 5

# [1] PID 控制（单累积器）
# --- 响应增益 ---
# KDP 融合系数（÷1000，1~1000，默认 300）：比例项 = 系数/1000 ×（误差 + 速度项×0.33 + CPU 补偿）
#   最终还会乘以分段倍率（PID_CUT）的 KDP 倍率（100=不削）
#   不累积；温度变化时重算，温度未变时保持上周期值（速度项定义见「速度映射」PID_SPEED）
#   调大→响应更激进、易过冲/振荡；调小→更稳但到位慢
PID_KDP=300

# KI速率（双值，均 ÷1000，各 1~1000，默认 20 30）：被积项 ≥0 用升速率、<0 用降速率
#   每次 PID 重算时 积分累积值 += 速率/1000 × 被积项（不乘时间；不是固定每 5 秒，稳态冻结时不累积），并限制在 [0, 1 − 比例项] 之间，防止积分越积越大、降温时迟迟退不下来（抗积分饱和）
#   被积项 = 受控量 − 滤波后动态目标（受控量见 KDP 融合系数 PID_KDP 的公式）
#   升/降速率还会分别乘以分段倍率（PID_CUT）的升/降倍率
PID_KI_RATE=20 30

# 速度项（三值）：速度倍率 ÷10 [0~1000] · 非线性阈值 ÷100 [10~100] · 非线性强度 ÷100 [0~400]
#   倍率 100 = 速度×10，0=关闭；全量速度进入积分，比例项使用衰减 0.33 的速度项；越大越跟手、过大易抖
#   阈值与强度决定低速段降权：速度幅度 ≥ 阈值完全跟随（1:1），< 阈值 按平滑阶跃取「强度」次幂降权；强度=0 完全不降权、阈值越小被降权的速度越多
PID_SPEED=100 20 100

# --- 动态目标 ---
# 三值：目标系数 ÷1000 [1~1000] · 目标指数平滑 % [1~100] · 目标上限（0.1°C）[1~100]
#   动态目标 = clamp(误差 × 系数/1000, ±上限)；三值默认 20 10 15；系数越大目标越激进，平滑越大跟随越快，平滑越小越平稳；上限限制单次目标偏移（默认 15=1.5°C）
#   「目标平滑(%)」仅在方向滤波（PID_TARGET_DIR）的开关关闭时生效
PID_TARGET=20 10 15

# --- 稳态冻结 ---
# 稳态冻结阈值（1~100，0.1°C，默认 2=0.2°C）：温度未变且上次偏差量绝对值 ≤ 阈值/10 时整轮冻结（偏差量 = 误差 + 速度项×倍率 + CPU 补偿）
#   冻结范围：积分/比例项/动态目标/上次偏差量全不更新，仅更新 CPU 补偿的比对基准（防冻结死锁）
PID_CH_THRESHOLD=2

# --- 输入补偿（始终生效）---
# 三值：平滑系数 1~100 · 除数 5~200 · 偏移量 0~500（0.1°C）
#   补偿 = clamp(CPU 平滑温度 − 电池温度 − 偏移量, 0) ÷ (除数 × 10)，再按平滑系数做指数平滑
#   门控滞回：CPU 高于电池+偏移时进入补偿；条件消失后平滑值向 0 收敛，归零才退出
PID_CPU_COMP=25 30 100

# --- 动态目标方向性滤波（仅 PID 生效）---
# 三值：开关 · 远离基线平滑系数% [1~100] · 回归基线平滑系数% [1~100]
#   目标量级增大（原始目标绝对值 超过当前滤波后目标）时用「远离系数」求快，否则用「回归系数」求稳
#   默认 1 20 10 = 远离 0.2、回归 0.1；开关=0 时退回动态目标（PID_TARGET）的「目标平滑(%)」单一系数
PID_TARGET_DIR=1 20 10

# --- 无变化回溯（仅 PID 生效）---
# 两值：开关 · 速度权重 ÷1000 [100~1000]，默认 1 1000 = 开启、注入全量速度
#   温度未变（本周期无新样本）时，用最近一次变化前的温度作锚点算速度
#   速度 = (当前温度 − 锚点温度) ÷ 累计周期数 ÷ 10 × 权重/1000，不再额外限幅
PID_SPEED_RECALL=1 1000

# --- 输出范围 ---
# 制冷范围（三值）：下限 0~194 · B6X 上限 0~194 · B7X 上限 1~255（下限与上限(B6X) 必须同时给；上限(B7X) 可省略）
#   下限必须小于上限；否则输出恒等于下限、不再随温度调节
#   上限(B7X) 省略时沿用上次值
#   上限同时是制冷映射（COLD_RPM_MAP）的比例分母基准，改上限会改变风扇映射曲线；B7X 上限只在连接 B7X 时生效
PID_COLD_RANGE=1 190 190

# --- 分段倍率 ---
# 按制冷强度分段削减 PID 的 KDP 与 KI 升/降速率（直接改比例项与积分速率，不直接调风扇转速；制冷档位变化后，风扇仍会按制冷映射跟着变）
# 格式（每个簇的值）：冷值,KDP倍率,升倍率,降倍率,...（每个四元组是一个点，界面按点显示；簇内乱序可容忍）
#   冷值 0~255（制冷强度档位；B6X 实际只到 194，填 195~255 在 B6X 上不生效）；三个倍率均 ×100（100=不削、0=完全压死），范围 0~200
#   仅用逗号分隔（纯空格分隔、无逗号的行会被忽略）；三个倍率字段可留空（连续两个逗号间不写）= 该点在该轴上不作为控制点（剔除后由相邻控制点直接连线）；冷值可留空 = 此点的三个倍率均不生效（整簇所有点冷值全留空才清空该簇、全段不削），冷值填了但非整数的点整点忽略；三个倍率只要有一个填了非整数，整簇作废（保持上一次的值），请避免小数点
#   簇内按冷值升序折线插值，两端外平推；同冷值重复保留先出现的点；多簇逐轴取离参照平均值（各簇覆盖区间内所有整数冷值候选值的总体平均）最近者（并列取更小倍率）；无有效簇则不削减
#   键名 PID_CUT_1 … PID_CUT_8（最多 8 簇；守护进程接受 1~8 任意簇号，界面按 1..N 连续生成）；单簇最多 32 点，超出的点忽略并记日志
#   旧键名 KI_CUT_<簇号>（三元组、无 KDP 倍率）仍被识别，并自动迁移为 PID_CUT_<簇号>（KDP 倍率补 100=不削）
PID_CUT_1=1,100,100,50,40,100,100,100,100,100,70,80,190,100,50,65

# [2] 接口与外围（独立大类：SYSFS_ENABLED=1 时加载，独立于性能总开关）
# 传感器 sysfs 路径，不同机型可能位置不同，可自行修改
#   本键默认/出厂为 0；下表默认值就是同一组内置默认值（路径与系数），只有机型路径不同才需要开启
# 缩放系数（除数）：内部值 = 原始值 ÷ 系数（电池温度、CPU 温度各一个），内部单位为 0.1°C
# 以下为 K60 机型推荐值，其他小米系一般通用，其他品牌请自行测试
# 运行中改为 0：已加载的路径与系数立即回落内置默认值，配置文件内容不动，改回 1 即恢复
SYSFS_ENABLED=0

# 电池温度路径，默认 /sys/class/power_supply/battery/temp；先用 root 终端查看该文件：350 一类的小数值表示 35.0°C（缩放系数填 1），35000 一类的大数表示 m°C（缩放系数填 100）
BATT_TEMP_PATH=/sys/class/power_supply/battery/temp

# 电池除数（1~10000，默认 1）：内部值 = 原始值 ÷ 系数，结果以 0.1°C 为宜
#   原始值已是 0.1°C（如 350）填 1；原始值是 m°C（如 35000）填 100；先用 root 终端查看该文件确认单位
BATT_TEMP_DIVISOR=1    # 范围1~10000

# 电池电流路径，默认 /sys/class/power_supply/battery/current_now
# 当前版本完全未读取，仅为后续版本预留；保持默认即可，填错也不影响温控
BATT_CURRENT_PATH=/sys/class/power_supply/battery/current_now
BATT_CURRENT_DIVISOR=10000    # 范围1~100000

# 温度模板，默认 /sys/class/thermal/thermal_zone%d/temp
#   %d 必须保留，会替换为目标 thermal_zone 编号；删掉 %d 会让所有 zone 读同一文件，CPU 温度失真
CPU_TEMP_PATH_FMT=/sys/class/thermal/thermal_zone%d/temp
CPU_TEMP_DIVISOR=100    # 范围1~10000

# 温区扫描（双值，各 0~99，须双值同给；后续只扫名单内 zone）
#   起始 zone 必须≤结束 zone，否则名单为空、CPU 温度不可用；有效 zone 超过 64 个时只取前 64 个；缩小范围可加速扫描
#   运行中修改区间会在下一个控制周期（5 秒）自动重建名单（无需重启）；K60 机型推荐 30~40（经验值，不确定就保持 0 99）
CPU_ZONE=0 99

# 有效 zone 名单与重扫（双值）：重扫间隔 1~720（控制周期，1 控制周期 = 5 秒） · 保留个数 1~64，默认 12 10 = 60 秒 / 10 个
#   按 CPU 温度扫描范围（CPU_ZONE）的区间建立有效 zone 名单（排除初值 ≤0）；此后每隔「重扫间隔」个控制周期在名单内重排，保留温度最高的 N 个 zone
#   修改 CPU 温度扫描范围（CPU_ZONE）的区间会在下一个 5 秒控制周期触发一次重建；修改间隔/保留数在下次重扫生效
CPU_ZONE_RESCAN=12 10

# CPU 亲和核/簇（默认 c0）：首字符 c = 簇模式，c 后每一位数字是一个簇号（c0 只用 0 号簇）
#   否则按核号：逗号分隔的项，每项是核号 N 或区间 N-M（0,5 = 核 0 和核 5；0-5 = 核 0~5；0,2-5 = 核 0 加上核 2~5）
#   空格与逗号同为分隔符：0 5 与 0,5 同义（都是核 0 和核 5 两个核，不是区间）
#   簇边界按本机内核拓扑现算（含 cpu0 的簇是 c0，其余按各簇首核号升序）；运行期与本机实际存在的核集合取交集，值非法或交集为空则回落默认
#   需先开启外围开关（SYSFS_ENABLED）才按本键取值，该键缺失或层未启用时按默认 c0 生效
#   值内不能带行内注释（本键不剥离 # 之后的内容，0,5  # 大核 会整串判非法并回落默认 c0）
CPU_AFFINITY=c0

# 日志路径（外围开关=1 时加载；空则自动按程序名在应用私有目录生成）
#   首次启动或恢复默认时自动生成；运行中清空本行保持当前路径不变
# 卸载或清除应用数据时会一并删除；不要改到会被系统定期清理的临时目录
LOG_FILE=/data/data/com.example.waspwingtempctrl/files/tempctrl.log

# 日志文件大小上限（字节，0~1048576，需先开启外围开关（SYSFS_ENABLED））：0=关闭全部日志（含错误日志）；超限时截断保留尾部并从完整行首起；调试日志（DEBUG_ENABLED）=1 时跳过截断、上限失效
LOG_MAX=16256

# [3] 拉起应用（独立于性能总开关，任何模式都生效）
# =1：断联或无散热器 app 存活时，自动拉起上次使用的 app（目标已运行/未安装则跳过；拉起后自动后台化，但依旧会闪烁一下界面）；=0：关闭（默认，需在界面中开启）
APP_LAUNCH_ENABLED=0

# 拉起冷却间隔（秒，0~3600，默认 60）：两次拉起的最小间隔，防断连频繁拉起；0=不冷却
APP_LAUNCH_COOLDOWN=60

# 亮屏门禁（二值）：开关 · Dozing 是否算亮屏
#   仅 Awake（或「息屏显示(AOD)也算亮屏」=1 时）才拉起，灭屏/息屏跳过（常态约每 12 秒、断联初期约每 10 秒复核一次）
#   默认 1 0 = 开启、Dozing 不算亮屏；屏幕状态读取失败一律按「可拉起」兜底（防探测失败死锁）
#   旧三值行「开关 读取失败默认值 Dozing」按原语义取第一、第三值，并写一条日志提示（第二值已废弃）
APP_LAUNCH_SCREEN_GATE=1 0

# 散热器锁死自动重启（锁死自动重启，独立于性能总开关，任何模式都生效）
# 停滞次数（0~120，默认 6，0=关闭）：实际制冷停滞（=上周期实际）且未达目标（≠上周期下发）连续 N 次下发 → 结束散热器 app 进程并重新拉起
#   两次结束进程之间至少间隔 300 秒；冷却期内不判定、不重启
#   前置条件：自动拉起 app 开关（APP_LAUNCH_ENABLED）=1；自动拉起关闭时运行时强制置 0（不改配置文件）
APP_WATCHDOG=6

# 双向保活（0/1，默认 1）：守护进程每 60 秒探测开机看门狗脚本是否存活，连续两次未见才拉起；存在则不重复拉起
#   方向与看门狗相反（守护进程 → 看门狗）；拉起冷却 300 秒，连续失败 3 次后退避 600 秒
WD_KEEPALIVE=1

# 断连自动开蓝牙（0~3600，默认 300，0=关闭）：后台重连发现蓝牙未开启时自动打开，两次之间至少间隔此秒数
#   独立于性能总开关，任何模式生效；0=关闭本功能
BT_AUTO_ENABLE_SEC=300

# 重连放行（0/1，默认 1）：开启后，在飞智 app 发起连接期间把上次连接的散热器地址按蓝牙设备处理，使后台自动重连能真正发起连接；关闭则恢复原行为
# 仅在飞智 app 内、仅在连接发起期间、仅对目标地址生效；改动即时生效（≤30 秒缓存）
UI_GATE_LE=1

# [4] 界面（多数仅界面读取；UI_BACK_HIDE 由守护进程读取）
# 断联（双值）：判定阈值 1~120（秒） · 空白最大宽度 1~600（秒）
#   相邻采样时间差超过「断联判定阈值」视为一次断联、曲线在该处断开；断联空白按真实断开时长在时间轴上按比例留白，超过「空白最大宽度」封顶
UI_GAP_SEC=3 15

# 动画速度（三值）：速率（dp/ms，存储值 ÷10，10~100，默认 32 = 3.2 dp/ms）
#   起步时间（毫秒，0~600，默认 240）
#   两端减速强度（%，0~100，默认 60 = 0.60）：越大两端越慢、中段越快，0 = 匀速
#   时长(ms) =（位移dp ÷ (速率值/10) + 起步ms）÷ 2（速率值填 32 表示 3.2 dp/ms；例：位移 300dp、速率 32、起步 240 → 约 167ms）；系统「动画时长缩放」不为 1 时实际时长会按倍数变化；缩放为 0（关闭动画）时跳过动画
UI_ANIM_TUNING=32 240 60

# 纵轴风扇转速下限（RPM，0~8000，默认 3000）：风扇转速低于此值的样本不参与左轴上下限计算，该段画到图外；过滤后左轴无有效数据时退回不过滤；0=关闭过滤
UI_RPM_AXIS_MIN=3000

# 曲线滤波（双值，实际值 = 存储值÷100）：每遍权重 0~100 · 最小步长 0~100，默认 15 5 = 0.15 / 0.05
#   热端与电池两条曲线共用这一对参数；先正向、再反向各做一次指数平滑（消除滞后），再把结果吸附到最小步长的整数倍（台阶化，减少抖动）
#   最小步长与曲线数值同量纲（实际值 = 存储值÷100，5=0.05）；具体显示单位随曲线轴
#   权重 = 0 或 100 都视为关闭平滑（100 = 1.0 = 恒等）；最小步长 = 0 视为关闭格点吸附
UI_CURVE_FILTER=15 5

# 返回隐藏（0/1，默认 1）：关闭则返回键恢复系统默认退出，守护进程拉起的收后台也不再隐藏
#   本组唯一被守护进程读取的键：由守护进程把开关同步给界面侧（内部机制，无需用户配置）
UI_BACK_HIDE=1    # 返回隐藏

# 默认页面（status|config|log，默认 config）：进入界面时默认显示的页面，取值只能是 status / config / log
UI_START_PAGE=config

# 自动更新（0/1，默认 1）：设备上的部署产物与 APK 内不一致时，由开机脚本在开机时自动重装并重启守护进程；关闭则只在 app 内弹窗请求
#   本键由开机脚本直接读本文件，读不到按 1 处理
UI_AUTO_UPDATE=1

# 部署入口（0/1，默认 1）：需重新部署时先进入状态页并给出提示；关闭则照常进入默认页面
#   自动更新开启时本项隐藏并按关闭处理；未取得 root 时仍按已保存的值生效（本行仍会隐藏，可在关闭自动更新后调整）
UI_DEPLOY_ENTRY=1
