name: Build LSPosed Module Only

on:
  push:
    paths:
      - 'lsp模块（apk修复+温控接口）/**'

jobs:
  build-apk:
    name: 编译 LSPosed 模块 APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./lsp模块（apk修复+温控接口）

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 授权 gradlew
        run: chmod +x gradlew

      - name: 编译 APK（b6x keystore 签名）
        run: ./gradlew assembleRelease

      - name: 重命名 APK（b6x-EP-LSPosed-v版本号.apk）
        run: |
          VERSION=$(grep "versionName" app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          cp app/build/outputs/apk/release/*.apk "b6x-EP-LSPosed-v${VERSION}.apk"

      - name: 上传 APK 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: b6x-EP-LSPosed
          path: b6x-EP-LSPosed-v*.apk
