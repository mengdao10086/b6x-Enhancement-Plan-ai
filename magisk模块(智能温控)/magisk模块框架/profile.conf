# 飞智 B6X 增强计划 — 智能温控配置
# 格式：KEY=VALUE（等号两边不要空格），# 开头为注释，空行自动跳过
# 修改后无需重启 daemon，下一轮 5 秒循环自动热重载
# 段标编号与 WebUI 分组一致（webroot/schema.js groups 顺序）：[0]日志 [1]性能参数 [2]sysfs [3]自动拉起 [4]WebUI

# [0] 日志 & 调试
DEBUG_ENABLED=0    # 调试日志总开关（独立于性能总开关，=1 开启调试分区输出）

# 分区开关（仅 DEBUG_ENABLED=1 时生效）
DEBUG_SENSOR=0    # 传感器读数
DEBUG_EXEC=0      # 执行下发（速率限制/广播 + 风扇转速）
DEBUG_CONN=0      # 连接状态
DEBUG_CONFIG=0    # 配置加载
DEBUG_MAIN=0      # 主循环
DEBUG_PID=0       # PID
DEBUG_LAUNCH=0    # 自动拉起

# [1] 性能总开关
# =0：除 DEBUG_ENABLED / SYSFS_ENABLED / [3]自动拉起 三个独立大类外，全部使用代码内默认值
# =1：正常加载所有性能参数
PERF_ENABLED=0

# [1] 通用参数
# --- 速率限制 ---
# 每 5 秒周期最大变化量，三参数独立限速
# 未完成量自然累积到下周期；目标变化时从当前实际值重新计算
RATE_LIMIT_FAN_UP=200 50       # 风扇升速限制（双值：升速基础值 50~2000，升速倍率 1~200），值 = 基础值 + d × 倍率 / 10，d = |电池温度 − BATT_BASELINE|（0.1°C），结果上限 2000 RPM
RATE_LIMIT_FAN_DOWN=400 200   # 风扇降速限制（双值：每周期最大降速量 50~2000，降速防抖阈值 0~2000）；阈值 0=不限制防抖，距最低转速 < 阈值×1.5 时防抖失效
RATE_LIMIT_COLD=25 10 3       # 制冷强度限速+最小变化幅度（三值：基础值 1~194，倍率 1~100，最小变化幅度 1~50），升/降速独立：升速=base+dev×mult/10，降速=base-dev×mult/10，负值→0=禁止该方向；最小变化幅度：目标与制冷实际 |差值| < 该值时上升下降都不下发（变化太小不如不动，距最高/最低 < 阈值×2 时失效允许精确到位）

# 断联少于 N 个控制周期（×5 秒）不重置 PID 状态（KDP/积分/误差等），输出连续不跳变；长断联或 0 时完整重置并进入待对齐（等待真实回传，不用回传值直接起步）
RECONNECT_KEEP_CYCLES=3   # 断联保留状态周期数（范围 0~30，默认 3 = 15 秒）

# --- PID 参数（本实现仅 PID 单模式）---
BATT_BASELINE=350   # 基准温度（0.1°C，范围 300~500，默认 350=35.0°C）：误差 = (电池温度 − 此值) / 10

CPU_FILTER_ALPHA=25   # CPU 温度 EMA 滤波系数（百分比，范围 1~100，默认 25=α0.25）：首次直取，此后按此系数平滑，越大越跟随原始值

COLD_MAP=40 150    # 制冷→风扇映射（双值：起始强度 0~194 · 指数 50~500）；起始强度：低于此值时线性外推下限；指数：n^exp（÷100，150=1.50），>1 低冷慢转

HOT_MAP=350 450    # 热端线性映射范围（双值：最低温度 最高温度，0.1°C，范围各 200~500，须双值同给）

RPM_SMOOTH_ALPHA=50   # 冷/热端→风扇转速映射的 EMA 平滑系数（百分比，范围 1~99；33 即 α=0.33），冷端指数映射与热端线性映射共用，值越大越跟随原始值，越小越平滑

FAN_RPM=2000 6000 6000   # 风扇转速范围（三值：最低转速 1000~6000 · B6X最高转速 1000~6000 · B7X最高转速 2000~8000；前两值须同给）；B7X 最高转速暂时与 B6X 一致，后续可独立调整

# --- 热端过温制冷上限削减 ---
HOT_DERATE=450 5 5   # 散热器热端过温时降低制冷强度上限，保护散热器硬件（三值：阈值 350~700(0.1°C) 倍率/单次恢复值 1~20 冷却周期数 0~20(×5s)）；热端 > 阈值 → 每次削减 (热端-阈值)×倍率/10；热端 ≤ 阈值且已有削减时每次恢复倍率；削减/恢复各自冷却 N 周期；热端数据无效(<0) 时保持当前削减

# [1] PID 控制（单累积器）
# --- 响应增益 ---
PID_KDP=300   # KDP 融合系数（÷1000，范围 1~1000）：kdp = 系数×(误差 + 速度×0.33 + CPU补偿)，无记忆，温度未变沿用上周期值

PID_KI_RATE=20 20   # KI 积分升/降速率（双值，均 ÷1000，范围各 1~1000）：被积项(ch-目标)≥0 用升速率、<0 用降速率，每周期 acc+=速率×(ch-目标)，不乘 dt，acc 钳 [0, 1−kdp]（抗 windup）；默认两者相同，可独立调整

PID_SPEED=100   # 速度倍率（÷10，范围 0~1000，100=速度×10，0=关闭）：温度变化速度对控制量的权重，同时进入积分与 KDP；数值越大越跟手，过大易抖

# --- 动态目标 ---
PID_TARGET=20 10 10   # PID 目标组合（三值：目标系数÷1000[1~1000] · 目标EMA平滑%[1~100] · 目标上限(0.1°C)[1~100]），动态目标=clamp(误差×系数, ±上限)，滤波越小越平稳，上限默认 10=1.0°C

# --- 稳态冻结 ---
PID_CH_THRESHOLD=2   # 稳态冻结阈值（单值，范围 1~100，单位 0.1°C，默认 2=0.2°C）：温度未变且上次 |ch| ≤ 此值/10 → 整轮冻结（acc/kdp/target/last_ch 全不动，仅推进补偿书签）

# --- 输入补偿（始终生效）---
#   comp = clamp(cpu滤波温度 - 电池温度 - 偏移, 0) ÷ (divisor × 10)，再按补偿滤波系数 EMA 平滑
#   门控滞回：条件满足进入补偿；条件消失后平滑值继续向 0 收敛，归零后才退出
PID_CPU_COMP=25 30 100   # 三值：补偿滤波系数 1~100 除数 5~200 偏移量 0~500(0.1°C)

# --- 动态目标方向性滤波（仅 PID 生效）---
#   alpha 动态 = |raw_target| > |当前 pid_target_f|（目标量级增大、远离基线）时用"远离alpha"求快，否则用"回归alpha"求稳
#   默认 1 20 10 = 远离 0.2、回归 0.1；开关=0 时退回 PID_TARGET 第2值的单一 alpha
PID_TARGET_DIR=1 20 10   # 三值：开关 远离基线alpha%[1~100] 回归基线alpha%[1~100]

# --- 无变化回溯（仅 PID 生效）---
#   v = (当前温度 − 锚点温度) ÷ 累计周期数 ÷ 10 × 权重/1000，不额外限幅；默认 1 1000 = 开启、注入全量速度
PID_SPD_RECALL=1 1000   # 两值：开关 · 回溯速度权重÷1000（范围 100~1000）；温度未变（本周期无新样本）时回溯最近一次变化前的锚点温度算速度

# --- 输出范围 ---
PID_COLD=1 190 190   # 制冷强度范围（三值：下限 0~194 · B6X上限 0~194 · B7X上限 1~255；前两值须同给）

# [2] sysfs 路径与缩放（独立大类：SYSFS_ENABLED=1 时加载，独立于性能总开关）
# 传感器 sysfs 路径，不同机型可能位置不同，可自行修改
# 缩放系数 = 原始值 / 缩放系数 → 内部单位 0.1°C（电池温度 / CPU 温度）
# 以下内容为 k60 机型推荐值，其他小米系应该也通用，其他品牌机型请自行测试
SYSFS_ENABLED=0

# 电池温度
BATT_TEMP_PATH=/sys/class/power_supply/battery/temp
BATT_TEMP_DIVISOR=1   # 范围 1~10000

# 电池电流（当前版本未参与控制，仅解析保留；原始值 µA ÷ 系数 = 0.01A）
BATT_CURRENT_PATH=/sys/class/power_supply/battery/current_now
BATT_CURRENT_DIVISOR=10000   # 范围 1~100000

# CPU 温度（%d 会替换为目标 thermal_zone 编号）
CPU_TEMP_PATH_FMT=/sys/class/thermal/thermal_zone%d/temp
CPU_TEMP_DIVISOR=100   # 范围 1~10000

# 缩小范围可加速扫描，K60 机型推荐 30~40
CPU_ZONE=0 99   # CPU thermal_zone 首次扫描范围（双值，各 0~99，须双值同给；后续只扫命中的 zone）

# 首次真全量扫描建立有效 zone 名单（排除初值≤0），后续只在此名单内重排保留最高温的 N 个
CPU_ZONE_RESCAN=60 10   # 重扫间隔 + 保留温度值个数（双值：重扫间隔(秒，5~3600) 保留个数(1~64)，默认 60 10）

LOG_FILE=/cache/tempctrl.log   # 日志文件路径（SYSFS_ENABLED=1 时加载；空则自动根据二进制名在 /cache/ 生成）
LOG_MAX=16256   # 字节，范围 0~1048576（同属 sysfs 层），0=关闭日志（超限时 ftruncate 截断保留尾部，从完整行首起）

# [3] 自动拉起散热器 app（独立于性能总开关，任何模式都生效）
APP_LAUNCH_ENABLED=0   # =1：断联或无散热器 app 存活时，自动拉起上次使用的 app（目标已运行/未安装则跳过；拉起后自动后台化，但依旧会闪烁一下界面）；=0：关闭

APP_LAUNCH_COOLDOWN=60   # 拉起冷却间隔（秒，默认 60，范围 0~3600）：两次拉起的最小间隔，防止断连频繁拉起；0=不冷却

# 拉起前屏幕状态门禁（三值：开关 读取失败默认值 Dozing是否算亮屏）
#   仅 dumpsys power 的 mWakefulness=Awake 才拉起；Asleep/Dozing 算灭屏跳过，每 5 秒重试直到亮屏
#   默认 1 1 0 = 开启、读取失败按"可拉起"兜底（防探测失败死锁）、Dozing 不算亮屏
APP_LAUNCH_SCREEN_GATE=1 1 0

# 散热器锁死自动重启（watchdog，独立于性能总开关，任何模式都生效）
APP_WATCHDOG=0   # 停滞次数（范围 0~120）：实际制冷停滞（=上周期实际）且未达目标（≠上周期下发）连续 N 次下发时，kill 散热器 app 并重新拉起；0=关闭；前置条件：APP_LAUNCH_ENABLED=1，自动拉起关闭时运行时强制置 0（不改配置文件）

# [4] WebUI 界面（仅 WebUI 读取，守护进程忽略）
WEBUI_GAP_DETECT_SEC=5   # 断联判定阈值（秒，范围 1~120，默认 5）：相邻采样时间差超过此秒数视为一次断联，曲线在该处断开
WEBUI_GAP_MAX_SEC=15   # 断联空白最大宽度（秒，范围 1~600，默认 15）：断联空白按真实断开时长等比显示，超过此秒数封顶
WEBUI_LABEL_MERGE_PX=9   # 标注合并阈值（px，范围 1~40，默认 9=0.8×标签高）：两条及以上曲线头部垂直相距不超过此值且上下端都落入时，合并为一个标签行
