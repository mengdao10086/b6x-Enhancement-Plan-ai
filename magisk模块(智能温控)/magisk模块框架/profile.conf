# [7] sysfs 路径与缩放（独立大类：SYSFS_ENABLED=1 时加载，独立于性能总开关）
# 传感器 sysfs 路径，不同机型可能位置不同，可自行修改
# 缩放系数 = 原始值 / 缩放系数 → 内部单位（0.1°C / µA）
# 以下内容为 k60 机型推荐值，其他小米系应该也通用，其他品牌机型请自行测试
