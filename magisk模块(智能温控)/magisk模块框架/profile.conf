# 飞智 B6X 增强计划 — 智能温控配置
# 格式：KEY=VALUE（等号两边不要空格），# 开头为注释，空行自动跳过
# 修改后无需重启 daemon，下一轮 5 秒循环自动热重载

# [0] 性能总开关
# =0：除 DEBUG_ENABLED / SYSFS_ENABLED 独立大类外，全部使用代码内默认值
# =1：正常加载所有性能参数
PERF_ENABLED=0


# [1] 日志 & 调试
# 调试日志总开关（独立于性能总开关，=1 开启调试分区输出）
DEBUG_ENABLED=0

# 分区开关（仅 DEBUG_ENABLED=1 时生效）
DEBUG_SENSOR=0    # 传感器读数
DEBUG_EMERG=0     # 紧急干预
DEBUG_BATT=0      # 电池温度控制
DEBUG_EXEC=0      # 执行下发
DEBUG_CONN=0      # 连接状态
DEBUG_CONFIG=0    # 配置加载
DEBUG_MAIN=0      # 主循环
DEBUG_PID=0       # PID


# [3] 通用参数（所有模式共享）
# --- 速率限制 ---
# 每 5 秒周期最大变化量，三参数独立限速
# 未完成量自然累积到下周期；目标变化时从当前实际值重新计算
RATE_LIMIT_FAN_UP=200 50    # 风扇升速限制（双值：升速基础值 50~2000， 升速倍率 1~200），值 = 基础值 + d(0.1°C) × 倍率 / 10
RATE_LIMIT_FAN_DOWN=400       # 风扇降速限制（范围 50~2000，与代码默认一致）
FAN_RPM_CHANGE_THRESHOLD=200  # 风扇转速降低变化阈值（0=不限制；距最低转速 < 阈值×1.5 时失效）
RATE_LIMIT_COLD=25 10         # 制冷强度限速（双值：基础值 1~194， 倍率 1~100），升/降速独立：升速=base+dev×mult/10，降速=base-dev×mult/10，负值→0=禁止该方向（37.5°以上禁降 / 32.5°以下禁升）
RATE_LIMIT_TEMP=2             # 目标温度 °C限制（范围 1~30）
# 温度值连续未变周期数上限（v2.8，范围 1~60，默认 6）
# 温度实际在变（1s 层检测到值变化）时会正常进入计算；连续 N 周期确实没变时仍强制进入一次，防止温度文件卡死导致控制停摆
BATT_SKIP_MAX=6

# --- PID / Gear 共用 ---
# 模式开关：0 = 常规 Gear 模式
#          1 = PID 无级调节
CTRL_MODE=1

# 基准温度（0.1°C），电池温度与此值计算偏差，PID 和 Gear 共用
BATT_BASELINE=350

# 制冷→风扇映射
COLD_MAP_START=40  # 映射起始强度，低于此值时线性外推下限
COLD_MAP_EXP=150   # n^exp（÷100，150=1.50），>1 低冷慢转

# 热端线性映射范围（双值：最低温度 最高温度，0.1°C）
HOT_MAP=350 450

# 冷/热端→风扇转速映射的 EMA 平滑系数（百分比，1~99，0.33=33）
# 冷端指数映射与热端线性映射共用，值越大越跟随原始值，越小越平滑
RPM_SMOOTH_ALPHA=33

# 风扇转速范围（三值：最低转速 最高转速(B6X) 最高转速(B7X)，PID 和 Gear 共用）
# B7X 最高转速暂时与 B6X 一致，后续可独立调整
FAN_RPM=2000 6000 6000


# [4] PID 模式控制（CTRL_MODE=1 启用，默认开启）
# --- 核心参数 ---
# KP（比例）：误差→输出敏感度。÷1000，数值越大误差越早被压制。
#   过大会在目标附近震荡，过小变化速度偏慢（范围 50~2000，推荐 200~500）。
PID_KP=300

# KI（积分）：消除长期静差。I 项累积受方差门控 + 死区回退双重控制。
#   过大降温滞后，过小温差推不动（范围 10~500，推荐 30~80）。
PID_KI=75

# KI积分上限（KI最高占比，防饱和。最高1000，默认800/1000*190=152）
PID_INTEGRAL_LIMIT=800

# --- KI 方差门控 ---
# KI 方差门控阈值（0.1°C²）
#   额外在温度方差低于此值时 I 项全温度段启用消除稳态静差，设 0 关闭方差门控，回仅死区模式。
#   范围 0~200，推荐 20~50。数值越小方差门控越不敏感（越难触发）。
PID_KI_VAR_THRESHOLD=50

# KI 方差采样数
#   温度更新时将原始值推入环形缓冲区，满后滑动计算方差，样本越多方差判断越滤波，但响应越慢。
PID_KI_VAR_SAMPLES=6

# KI 积分分离死区（0.1°C）
#   方差门控未激活（或采样不足）时的回退阈值：|error| < 此值则累积 I。
#   范围 0~100（即 0~10.0°C），推荐 10~30。
PID_KI_DEADBAND=20

# KD（微分）：抑制过冲，温度变化越快出力越大。
#   太大调节缓慢甚至反冲，太小容易过冲（范围 0~500，推荐 100~300）。
PID_KD=200

# --- 输入滤波 ---
# PID 输入滤波开关（默认关：非预测直通原始值；预测进入/退出后 6 周期自动临时开启防跳变）
PID_INPUT_FILTER_ENABLED=0
PID_FILTER_AUTO_THRESHOLD=30 20   # 双值：自动关闭阈值 自动恢复阈值（×0.1周期）
PID_ALPHA=20 33 33  # 三值：更新间隔滤波强度(%) 电池温度滤波强度(%) 预测滤波强度(%)

# --- 输入补偿 ---
# CPU 补偿：comp = clamp(cpu - batt, 0) / PID_CPU_COMP_DIVISOR，滤波复用 CPU_FILTER_ALPHA（25%）
PID_CPU_COMP_ENABLED=1       # CPU 补偿开关（=1 启用）
PID_CPU_COMP_DIVISOR=30      # (cpu-batt 0.1°C)÷divisor→0.1°C，范围 5~200

# --- 温度预测 ---
# 方向权重 + 抑制系数（三值：升温权重 降温权重 低于稳定性闸门的增量抑制系数%，0~100）
#   升温默认10（全效），降温默认5（半效）；抑制系数默认50=×0.5，0=完全抑制=停止
#   稳定性闸门 ×1：两点变化率 < PID_PREDICT_MIN_DELTA 时不停止，仅预测增量 × 抑制系数
PID_PREDICT_WEIGHT=10 5 50

# 预测窗口（三值：缓冲区大小 最大计算窗口 最小计算窗口，3~32/3~10/2~5）
PID_PREDICT_WIN=10 5 2

# 预测上升限制（双值：最大温升0.1°C Ramp-up周期数，10~100/0~10）
PID_PREDICT_RISE=30 3

# 最小起始 delta 0.1°C/周期（1~10，默认2=0.2°C）
PID_PREDICT_MIN_DELTA=2

# --- 输出范围 ---
# 制冷强度范围（三值：下限 上限(B6X) 上限(B7X)）
# B7X 上限暂时与 B6X 一致，后续可独立调整
PID_COLD=1 190 190


# [5] Gear 模式 — 电池控制（CTRL_MODE=0 时生效）
# --- 基础电池温度调档 ---
# 三区间阈值（3 值：死区 ±1档边界 ±2档边界，0.1°C）
BATT_BOUNDARY=5 13 25

# 档位变动冷却（每次任意原因导致的档位变动后冻结 N 周期 ×5 秒），紧急不受限
BATT_COOLDOWN_CYCLES=3

# --- 电流-挡位映射 + 温度偏移累积 ---
# 电流-挡位映射开关（第一位充电，第二位放电。0=仅普通电池温度，1=电流映射推荐挡位）
CURRENT_GEAR_MODE=1 1

# 推荐档位 = 滤波电流(0.01A) × 倍率 ÷ 100，温度在此基础累积偏移（带冷却）
CURRENT_GEAR_MULT=2 6    # 双值：充电倍率 放电倍率（如 3A×2=6档 / 8A×6 并 clamp 到 max 档）

# 电流滤波强度（百分比，1~100）
CURRENT_GEAR_SMOOTH_ALPHA=25

# 推荐档位低于此值时回退到基准（电池温度）模式
CURRENT_GEAR_MIN=6

# --- 趋势豁免 / 过冲反补 ---
# 反补 + 趋势豁免开关（双值：反补 趋势豁免，=0 禁用对应功能）
REV_COMP=1 1

# 三级阈值（3 值，默认 2 3 4 = 0.2°C/0.3°C/0.4°C 每周期）
# 传感器跳变时温差 ÷ 周期数 归一化后查表
REV_COMP_T=2 3 4

# 反补冷却周期数（反补生效后冻结 N 周期，期内累积温差，到期合并计算）
REV_COMP_COOLDOWN=1

# 趋势豁免锚点复位参数（首次豁免记录当前电池温度为锚点，
# 以区间中值为偏移量计算复位阈值，越过则复位豁免计数器）
TREND_RESET_THRESHOLD=6


# [6] Gear 模式 — 紧急干预（CTRL_MODE=0 时生效）
# --- CPU 温度紧急 ---
# CPU 温度紧急独立开关（=0 禁用）
EMERG_CPU_ENABLED=1

# CPU 温度（4 值：退出紧急 进入1级 进入2级 进入3级，0.1°C）
#   > 值1/2/3 → 进入紧急 1/2/3，< 值0/1/2 → 恢复到 0/1/2
CPU_EMERG=550 650 750 850

# CPU 温度滤波强度（百分比，越大越跟原始值，越小越滤波）
CPU_FILTER_ALPHA=25

# --- 紧急模式与强制 ---
# 紧急干预模式（两数字：第一位升档，第二位降档。0=表查，1=步进）
EMERG_MODE=0 1

# 强制最低档位（4 值：等级1 等级2 等级3 等级4）
EMERG_FORCED=6 8 10 12

# 退出钳制偏移量（cap = 高一级最低档 + 此值），仅降档模式=0 生效
EMERG_EXIT_CAP_OFFSET=1

# 升/降档步数，模式=1 时生效
EMERG_STEP=2

# 电池温度低于基准+此值 → 全效退出，低于基准+此值×2 → 半效退出
EMERG_EXIT_BATT_THRESHOLD=20

# --- 紧急退出恢复期 ---
# 退出紧急后调档阈值逐步恢复：×P1 → ×P2 → ×P3 → 1（正常）
# 每阶段持续 EMERG_RECOVERY_PHASE_CYCLES 周期，连续退出重启，重新进入取消
EMERG_RECOVERY_MULT=6 4 2
EMERG_RECOVERY_PHASE_CYCLES=6


# [7] Gear 模式 — 挡位表（CTRL_MODE=0 时可选生效）
# 独立开关：=1 时使用下方 GEAR_N，=0 使用代码默认表
GEAR_CONFIG_ENABLED=0

# 挡位表自动风扇转速开关
# =1：用冷端强度+热端温度双映射计算风扇转速（PID 同款逻辑），挡位表风扇转速变为截断上限
# =0：直接使用挡位表配置的风扇转速（旧行为）
GEAR_AUTO_FAN=1

# B6X 档位表：GEAR_B6X_N=模式,目标温度(°C),风扇RPM,制冷强度
#  模式=0(智能温控)：targetTemperature + windLevel(风扇上限)
#  模式=1(固定功率)：windLevelOverclock(风扇固定) + coldLevelOverclock(制冷强度)
# 范围：N=1~32, 模式=0/1, 目标=5~35°C, 风扇=2000~6000RPM, 制冷=1~190（B6X/B7X 当前相同，后续可独立）
# 说明1：智能温控风扇上限疑似非强制生效，易导致噪音突增，不建议使用
# 说明2：B6X 最高制冷量区间为 180~200，再高因鳍片解热不足反而倒退
GEAR_B6X_12=1,0,6000,190
GEAR_B6X_11=1,0,5500,180
GEAR_B6X_10=1,0,5000,165
GEAR_B6X_9=1,0,4500,145
GEAR_B6X_8=1,0,4000,125
GEAR_B6X_7=1,0,3500,100
GEAR_B6X_6=1,0,3050,75
GEAR_B6X_5=1,0,2650,55
GEAR_B6X_4=1,0,2300,35
GEAR_B6X_3=1,0,2000,20
GEAR_B6X_2=1,0,2000,10
GEAR_B6X_1=1,0,2000,5

# B7X 档位表：GEAR_B7X_N=模式,目标温度(°C),风扇RPM,制冷强度（与 B6X 独立配置，当前内容复用 B6X）
GEAR_B7X_12=1,0,6000,190
GEAR_B7X_11=1,0,5500,180
GEAR_B7X_10=1,0,5000,165
GEAR_B7X_9=1,0,4500,145
GEAR_B7X_8=1,0,4000,125
GEAR_B7X_7=1,0,3500,100
GEAR_B7X_6=1,0,3050,75
GEAR_B7X_5=1,0,2650,55
GEAR_B7X_4=1,0,2300,35
GEAR_B7X_3=1,0,2000,20
GEAR_B7X_2=1,0,2000,10
GEAR_B7X_1=1,0,2000,5


# [2] sysfs 路径与缩放（独立大类：SYSFS_ENABLED=1 时加载，独立于性能总开关）
# 传感器 sysfs 路径，不同机型可能位置不同，可自行修改
# 缩放系数 = 原始值 / 缩放系数 → 内部单位（0.1°C / µA）
# 以下内容为 k60 机型推荐值，其他小米系应该也通用，其他品牌机型请自行测试
SYSFS_ENABLED=0

# 电池温度
BATT_TEMP_PATH=/sys/class/power_supply/battery/temp
BATT_TEMP_DIVISOR=1

# 电池电流
BATT_CURRENT_PATH=/sys/class/power_supply/battery/current_now
BATT_CURRENT_DIVISOR=10000

# CPU 温度（%d 会替换为目标 thermal_zone 编号）
CPU_TEMP_PATH_FMT=/sys/class/thermal/thermal_zone%d/temp
CPU_TEMP_DIVISOR=100

# CPU thermal_zone 首次扫描范围（所有模式共用，后续只扫命中的 zone）
# 缩小范围可加速扫描，K60 机型推荐 30~40
CPU_ZONE=0 99

# 日志文件路径（空则自动根据二进制名在 /cache/ 生成）
LOG_FILE=/cache/tempctrl.log
LOG_MAX=7936   # 字节，0=关闭日志
LOG_TRIM_LINES=3   # 日志超限时删除最早 N 行，0=不清理


# 自动拉起散热器 app（v2.8，独立于性能总开关，任何模式都生效）
# =1：无散热器 app 存活时，自动拉起上次使用的 app（拉起后自动后台化，几乎无感）；=0：关闭
# 默认 0：刷入时可用音量±选择（音量+开启 / 音量-关闭 / 不操作默认关闭）
APP_LAUNCH_ENABLED=0
