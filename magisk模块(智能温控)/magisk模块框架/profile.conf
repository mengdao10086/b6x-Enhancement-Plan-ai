CPU_TEMP_DIVISOR=100

# CPU thermal_zone 首次扫描范围（所有模式共用，后续只扫命中的 zone）
# 缩小范围可加速扫描，K60 机型推荐 30~40
CPU_ZONE=0 99

# CPU thermal_zone 全量重扫间隔（秒，默认 60，范围 5~3600）
# 按此间隔重新全量扫描，更新保留的最高温 zone 列表（负载迁移时跟随变化）
CPU_ZONE_RESCAN=60

# 日志文件路径（空则自动根据二进制名在 /cache/ 生成）
LOG_FILE=/cache/tempctrl.log
LOG_MAX=7936   # 字节，0=关闭日志（超限时 ftruncate 截断保留尾部，从完整行首起）


# 自动拉起散热器 app（独立于性能总开关，任何模式都生效）
# =1：无散热器 app 存活时，自动拉起上次使用的 app（拉起后自动后台化，几乎无感）；=0：关闭
# 默认 0：刷入时可用音量±选择（音量+开启 / 音量-关闭 / 不操作默认关闭）
APP_LAUNCH_ENABLED=0
