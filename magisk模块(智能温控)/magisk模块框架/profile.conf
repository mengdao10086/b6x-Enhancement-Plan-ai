# 飞智 B6X 增强计划 — 智能温控配置
# 格式：KEY=VALUE（等号两边不要空格），# 开头为注释，空行自动跳过
# 修改后无需重启 daemon，下一轮 5 秒循环自动热重载
# 段标编号与 WebUI 分组一致（webroot/schema.js groups 顺序）：[0]日志 [1]性能参数 [2]sysfs [3]自动拉起 [4]WebUI

# [0] 日志 & 调试
# 调试日志总开关（独立于性能总开关，=1 开启调试分区输出）
DEBUG_ENABLED=0

# 分区开关（仅 DEBUG_ENABLED=1 时生效）
DEBUG_SENSOR=0    # 传感器读数
DEBUG_EXEC=0      # 执行下发（速率限制/广播 + 风扇转速）
DEBUG_CONN=0      # 连接状态
DEBUG_CONFIG=0    # 配置加载
DEBUG_MAIN=0      # 主循环
DEBUG_PID=0       # PID
DEBUG_LAUNCH=0    # 自动拉起

# [1] 性能总开关
# =0：除 DEBUG_ENABLED / SYSFS_ENABLED 独立大类外，全部使用代码内默认值
# =1：正常加载所有性能参数
PERF_ENABLED=0

# [1] 通用参数
# --- 速率限制 ---
# 每 5 秒周期最大变化量，三参数独立限速
# 未完成量自然累积到下周期；目标变化时从当前实际值重新计算
RATE_LIMIT_FAN_UP=200 50       # 风扇升速限制（双值：升速基础值 50~2000，升速倍率 1~200），值 = 基础值 + d(0.1°C) × 倍率 / 10
RATE_LIMIT_FAN_DOWN=400 200   # 风扇降速限制（双值：每周期最大降速量 50~2000，降速防抖阈值 0~2000）；阈值 0=不限制防抖，距最低转速 < 阈值×1.5 时防抖失效
RATE_LIMIT_COLD=25 10 3       # 制冷强度限速+最小变化幅度（三值：基础值 1~194，倍率 1~100，最小变化幅度 1~50），升/降速独立：升速=base+dev×mult/10，降速=base-dev×mult/10，负值→0=禁止该方向；最小变化幅度：目标与制冷实际 |差值| ≤ 该值时上升下降都不下发（变化太小不如不动，距最高/最低 < 阈值×2 时失效允许精确到位）

# 断联保留状态周期数（范围 0~30，默认 3 = 15 秒）
# 断联少于 N 个控制周期（×5 秒）不重置 PID 状态（kd/积分/误差等），输出连续不跳变；0=总是重置
RECONNECT_KEEP_CYCLES=3

# --- PID 参数（本实现仅 PID 单模式）---
# 基准温度（0.1°C），电池温度与此值计算偏差
BATT_BASELINE=350

# 制冷→风扇映射（双值：起始强度 指数）
COLD_MAP=40 150    # 起始强度：低于此值时线性外推下限；指数：n^exp（÷100，150=1.50），>1 低冷慢转

# 热端线性映射范围（双值：最低温度 最高温度，0.1°C）
HOT_MAP=350 450

# 冷/热端→风扇转速映射的 EMA 平滑系数（百分比，1~99，0.33=33）
# 冷端指数映射与热端线性映射共用，值越大越跟随原始值，越小越平滑
RPM_SMOOTH_ALPHA=50

# 风扇转速范围（三值：最低转速 B6X最高转速 B7X最高转速）
# B7X 最高转速暂时与 B6X 一致，后续可独立调整
FAN_RPM=2000 6000 6000

# --- 热端过温制冷上限削减 ---
# 散热器热端过温时降低制冷强度上限，保护散热器硬件（三值：阈值(0.1°C) 倍率/单次恢复值 冷却周期数(×5s)）
# 热端 > 阈值 → 每次削减 (热端-阈值)×倍率/10；回落每次恢复倍率；削减/恢复后冷却 N 周期
HOT_DERATE=450 5 5

# [1] PID 控制（单累积器）
# --- 响应增益 ---
# PID 增益组合（三值，均 ÷1000：KDP融合系数·KI积分增益·速度倍率），KDP=系数×(误差+速度×0.33+CPU补偿)，KI每周期 acc+=KI×(ch-目标)，SPEED ch=误差+速度×此值+CPU补偿
PID_GAIN=300 20 240

# --- 动态目标 ---
# PID 目标组合（三值：目标系数÷1000 · 目标EMA平滑% · 目标上限(0.1°C)），动态目标=clamp(误差×系数, ±上限)，滤波越小越平稳，上限默认 10=1.0°C
PID_TARGET=20 10 10

# --- 稳态冻结 ---
# 稳态冻结阈值（单值，0.1°C）：温度未变且上次 |ch|≤此值 → 整轮冻结（防抖）；1=默认 0.1°C
PID_CH_THRESHOLD=2

# --- 输入补偿（始终生效）---
# CPU 补偿（三值：补偿滤波系数 除数 偏移量(0.1°C)）
#   comp = clamp(cpu滤波温度 - 电池温度 - 偏移, 0) ÷ divisor，再按补偿滤波系数 EMA 平滑
#   门控滞回：条件满足进入补偿；条件消失后平滑值继续向 0 收敛，归零后才退出
PID_CPU_COMP=25 30 100

# --- 输出端自适应滤波（仅 PID 生效）---
# PID 输出端 EMA 滤波（五值：开启 下限α(‰) 温差增益(‰/0.1°) 偏差增益(‰/0.1°) 下降倍率(×0.1)）
#   α = 每周期平均温差×温差增益 + 距目标偏差×偏差增益；下限钳制到 base（最低 0.1），下降方向 α×下降倍率
#   默认 1 100 100 10 20 = 下限0.1、温差每0.1°+0.1、偏差每0.1°+0.01、下降×2
PID_OUT_FILTER=1 100 100 10 20

# --- 输出范围 ---
# 制冷强度范围（三值：下限 B6X上限 B7X上限）
PID_COLD=1 190 190

# [2] sysfs 路径与缩放（独立大类：SYSFS_ENABLED=1 时加载，独立于性能总开关）
# 传感器 sysfs 路径，不同机型可能位置不同，可自行修改
# 缩放系数 = 原始值 / 缩放系数 → 内部单位（0.1°C / µA）
# 以下内容为 k60 机型推荐值，其他小米系应该也通用，其他品牌机型请自行测试
SYSFS_ENABLED=0

# 电池温度
BATT_TEMP_PATH=/sys/class/power_supply/battery/temp
BATT_TEMP_DIVISOR=1

# 电池电流
BATT_CURRENT_PATH=/sys/class/power_supply/battery/current_now
BATT_CURRENT_DIVISOR=10000

# CPU 温度（%d 会替换为目标 thermal_zone 编号）
CPU_TEMP_PATH_FMT=/sys/class/thermal/thermal_zone%d/temp
CPU_TEMP_DIVISOR=100

# CPU thermal_zone 首次扫描范围（所有模式共用，后续只扫命中的 zone）
# 缩小范围可加速扫描，K60 机型推荐 30~40
CPU_ZONE=0 99

# CPU thermal_zone 重扫间隔 + 保留温度值个数（双值：重扫间隔(秒，5~3600) 保留个数(1~64)，默认 60 10）
# 首次真全量扫描建立有效 zone 名单（排除初值≤0），后续只在此名单内重排保留最高温的 N 个
CPU_ZONE_RESCAN=60 10

# 日志文件路径（空则自动根据二进制名在 /cache/ 生成）
LOG_FILE=/cache/tempctrl.log
LOG_MAX=16256   # 字节，0=关闭日志（超限时 ftruncate 截断保留尾部，从完整行首起）

# [3] 自动拉起散热器 app（独立于性能总开关，任何模式都生效）
# =1：无散热器 app 存活时，自动拉起上次使用的 app（拉起后自动后台化，但是依旧会闪烁一下界面）；=0：关闭
APP_LAUNCH_ENABLED=0

# 拉起冷却间隔（秒，默认 60，范围 0~3600）：两次拉起的最小间隔，防止断连频繁拉起；0=不冷却
APP_LAUNCH_COOLDOWN=60

# 散热器锁死自动重启（watchdog，独立于性能总开关，任何模式都生效）
# =停滞次数：实际制冷停滞（=上周期实际）且未达目标（≠上周期下发）连续 N 次下发时，kill 散热器 app 并重新拉起；=0：关闭
APP_WATCHDOG=0

# [4] WebUI 界面（仅 WebUI 读取，守护进程忽略）
# 断联判定阈值（秒，范围 1~120，默认 5）：相邻采样时间差超过此秒数视为一次断联，曲线在该处断开
WEBUI_GAP_DETECT_SEC=5
# 断联空白最大宽度（秒，范围 1~600，默认 15）：断联空白按真实断开时长等比显示，超过此秒数封顶
WEBUI_GAP_MAX_SEC=15
