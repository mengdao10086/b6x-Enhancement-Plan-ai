# 退出钳制偏移量（cap = 高一级最低档 + 此值），仅降档模式=0 生效
EMERG_EXIT_CAP_OFFSET=1

# 升/降档步数，模式=1 时生效
EMERG_STEP=2

# 电池温度低于基准+此值 → 全效退出，低于基准+此值×2 → 半效退出
EMERG_EXIT_BATT_THRESHOLD=20

# --- 紧急退出恢复期 ---
# 退出紧急后调档阈值逐步恢复：×P1 → ×P2 → ×P3 → 1（正常）
# 每阶段持续 EMERG_RECOVERY_PHASE_CYCLES 周期，连续退出重启，重新进入取消
