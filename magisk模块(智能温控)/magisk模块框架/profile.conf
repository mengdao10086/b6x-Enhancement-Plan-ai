# 飞智 B6X 增强计划 — 智能温控配置
# 格式：KEY=VALUE（等号两边不要空格），# 开头为注释，空行自动跳过
# 修改后无需重启 daemon，下一轮 5 秒循环自动热重载

# [0] 性能总开关
# =0：除 DEBUG_ENABLED / SYSFS_ENABLED 独立大类外，全部使用代码内默认值
# =1：正常加载所有性能参数
PERF_ENABLED=0


# [1] 日志 & 调试
# 调试日志总开关（独立于性能总开关，=1 开启调试分区输出）
DEBUG_ENABLED=0

# 分区开关（仅 DEBUG_ENABLED=1 时生效）
DEBUG_SENSOR=0    # 传感器读数
DEBUG_EMERG=0     # 紧急干预
DEBUG_BATT=0      # 电池温度控制
DEBUG_EXEC=0      # 执行下发
DEBUG_CONN=0      # 连接状态
DEBUG_CONFIG=0    # 配置加载
DEBUG_MAIN=0      # 主循环
DEBUG_PID=0       # PID
DEBUG_LAUNCH=0    # 自动拉起
DEBUG_FAN=0       # 风扇转速


# [2] 通用参数（所有模式共享）
# --- 速率限制 ---
# 每 5 秒周期最大变化量，三参数独立限速
# 未完成量自然累积到下周期；目标变化时从当前实际值重新计算
RATE_LIMIT_FAN_UP=200 50       # 风扇升速限制（双值：升速基础值 50~2000，升速倍率 1~200），值 = 基础值 + d(0.1°C) × 倍率 / 10
RATE_LIMIT_FAN_DOWN=400 200   # 风扇降速限制（双值：每周期最大降速量 50~2000，降速防抖阈值 0~2000）；阈值 0=不限制防抖，距最低转速 < 阈值×1.5 时防抖失效
RATE_LIMIT_COLD=25 10 3       # 制冷强度限速+上升死区（三值：基础值 1~194，倍率 1~100，上升死区 1~50），升/降速独立：升速=base+dev×mult/10，降速=base-dev×mult/10，负值→0=禁止该方向（37.5°以上禁降 / 32.5°以下禁升）；上升死区：制冷上升且变化量 ≤ 该值时不下发（上升太少不如不升，距最高/最低 < 阈值×2 时失效允许精确到位）
RATE_LIMIT_TEMP=2             # 目标温度 °C限速（范围 1~30）

# 温度值连续未变周期数上限（范围 1~60，默认 6）
# 温度实际在变（1s 层检测到值变化）时会正常进入计算；连续 N 周期确实没变时仍强制进入一次，防止温度文件卡死导致控制停摆
BATT_SKIP_MAX=6

# --- PID / Gear 共用 ---
# 模式开关：0 = 常规 Gear 模式
#          1 = PID 无级调节
CTRL_MODE=1

# 基准温度（0.1°C），电池温度与此值计算偏差，PID 和 Gear 共用
BATT_BASELINE=350

# 制冷→风扇映射（双值：起始强度 指数）
COLD_MAP=40 150    # 起始强度：低于此值时线性外推下限；指数：n^exp（÷100，150=1.50），>1 低冷慢转

# 热端线性映射范围（双值：最低温度 最高温度，0.1°C）
HOT_MAP=350 450

# 冷/热端→风扇转速映射的 EMA 平滑系数（百分比，1~99，0.33=33）
# 冷端指数映射与热端线性映射共用，值越大越跟随原始值，越小越平滑
RPM_SMOOTH_ALPHA=50

# 风扇转速范围（三值：最低转速 B6X最高转速 B7X最高转速，PID 和 Gear 共用）
# B7X 最高转速暂时与 B6X 一致，后续可独立调整
FAN_RPM=2000 6000 6000

# --- 热端过温制冷上限削减 ---
# 散热器热端过温时降低制冷强度上限，保护散热器硬件（三值：阈值(0.1°C) 倍率/单次恢复值 冷却周期数）
# 热端 > 阈值 → 每次削减上限 (热端-阈值)×倍率，削减后冷却周期内不再削减
# 热端 ≤ 阈值 → 每次恢复 5（复用倍率值），恢复后冷却周期内不再恢复
HOT_DERATE=450 5 5


# [3] PID 模式控制（CTRL_MODE=1 启用，默认开启）
# --- 核心参数 ---
# KP 比例（单值：增益÷1000，300=偏差3°满幅），线性无分段
PID_KP=300

# KI 积分增益（四值：高基准基础 高基准每°C增益 低基准基础 低基准每°C增益，均÷1000）
#   V 形增益（连续线性）：温度高于基准 → 累积制冷记忆，gain=基础20+每°C20×error（建立）
#   温度低于基准 → 释放制冷记忆，gain=基础50+每°C50×|error|（离基准越远回落越快）
#   建立慢、释放快：接近基准慢积累防过冲，低于基准快速释放防滞留；高基准累积受门控、低基准回落无条件
PID_KI=20 20 50 50

# KI 记忆（三值：下降惩罚 固定衰减 积分上限，均÷1000）
#   下降惩罚：本次比上次降温时，每降低1°C直接扣累计值 100/1000（作用于累计值，降温即释放）
#   固定衰减：每周期向 0 收敛 30/1000=0.03（始终生效，不受门控，兜底释放）
#   上限：I项最大输出贡献防饱和，实际生效 = min(剩余预算 1−P−D, 此值)
PID_KI_MEM=100 30 667

# --- KI 门控 ---
# KI 门控（三值：方差阈值 采样数 积分死区(0.1°C)）
#   阈值（0.1°C²）：温度方差低于此值时 I 项全温度段启用消除稳态静差，设 0 关闭方差门控回仅死区模式。
#   采样数：温度更新时将原始值推入环形缓冲区，满后滑动计算方差，样本越多方差判断越滤波但响应越慢。
#   死区：方差门控未激活（或采样不足）时的回退阈值，温度偏差 < 此值则累积 I。
PID_KI_VAR=20 6 15

# KD 微分（双值：上升倍率 下降倍率，均÷1000），无分段
#   上升（温度升高 de>0）用上升倍率；下降（温度降低 de<0）用下降倍率。
#   每周期每度变化每KD为0.001归一化输出（0.19制冷强度）。
PID_KD=240 360
# KD 记忆（三值：记忆衰减 记忆幅值基础 幅值斜率，均÷1000）
#   衰减：D 项记忆（泄漏积分器）每周期向 0 收敛的固定量（默认 0.03），消除非线性带来的方向不对称。
#   幅值基础：D 记忆对称钳位基准值（默认 0.15）；幅值斜率：每距基准 1°C 上限增加量（默认 0.15/°C）。
#   实际上限 = 基础 + 距基准°C × 斜率（误差大放宽、接近基准收紧）。
PID_KD_MEM=30 150 150

# KD 近区降敏（双值：近区阈值(0.1°C) 近区倍率(÷1000)）
#   |de| < 阈值（默认 2=0.2°C）视为近区（传感器微抖），D 项变化量 × 倍率（默认 333≈1/3）降敏，
#   抑制微抖被微分放大导致制冷强度掉档；|de| >= 阈值全量响应。
PID_KD_NEAR=2 333

# --- 输入滤波 ---
# PID 输入滤波（三值：开启 自动关闭阈值 自动恢复阈值，×0.1周期）；默认开启，温度更新间隔大时自动关滤波、恢复后自动开
PID_INPUT_FILTER=1 30 20
PID_ALPHA=20 33    # 双值：更新间隔滤波强度(%) 电池温度滤波强度(%)（预测滤波强度已随预测迁到 Gear）

# --- 输入补偿（PID 与 Gear 共用，始终生效）---
# CPU 补偿（三值：补偿滤波系数 除数 偏移量(0.1°C)）
#   comp = clamp(cpu滤波温度 - 电池温度 - 偏移, 0) ÷ divisor，再按补偿滤波系数 EMA 平滑（首次上次值用 0，从 0 爬升）
#   偏移默认 100=10.0°C：CPU 需比电池高 10°C 以上才产生补偿
#   门控滞回：条件满足进入补偿；条件消失后平滑值继续向 0 收敛，归零后才退出（不瞬间跳变归零）
PID_CPU_COMP=25 30 100

# --- 输出端自适应滤波（仅 PID 模式生效）---
