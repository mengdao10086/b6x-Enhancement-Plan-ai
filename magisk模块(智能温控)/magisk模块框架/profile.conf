# 飞智 B6X 增强计划 — 智能温控配置
# 格式：KEY=VALUE（等号两边不要空格），# 开头为注释，空行自动跳过
# 修改后无需重启 daemon，下一轮 5 秒循环自动热重载

# [0] 系统控制
# 配置文件的全局开关（包括挡位表）
# =0：不加载以下任何参数，全部使用代码内默认值
# =1：正常加载以下所有参数
CONFIG_ENABLED=0

# LSPosed 模块 status 文件 mtime 超时秒数，超过则判断模块已死
STATUS_TIMEOUT=11


# [1] sysfs 路径与缩放
# 传感器 sysfs 路径，不同机型可能位置不同，可自行修改
# 缩放系数 = 原始值 / 缩放系数 → 内部单位（0.1°C / µA）
# 以下内容为 k60 机型推荐值，其他小米系应该也能用，其他品牌机型请自行测试

# 电池温度
BATT_TEMP_PATH=/sys/class/power_supply/battery/temp
BATT_TEMP_DIVISOR=1

# CPU 温度（%d 会替换为目标 thermal_zone 编号）
CPU_TEMP_PATH_FMT=/sys/class/thermal/thermal_zone%d/temp
CPU_TEMP_DIVISOR=100

# CPU thermal_zone 首次扫描范围（所有模式共用，后续只扫命中的 zone）
# 缩小范围可加速首次扫描（默认 0~99 全扫），K60 机型推荐 30~40
CPU_ZONE_MIN=30
CPU_ZONE_MAX=40

# 电池电流
BATT_CURRENT_PATH=/sys/class/power_supply/battery/current_now
BATT_CURRENT_DIVISOR=1


# [2] 日志 & 调试

# 日志文件路径（空则自动根据二进制名在 /cache/ 生成）
LOG_FILE=/cache/tempctrl.log
LOG_MAX_KB=7   # KB，0=关闭日志

# 调试日志总开关（=1 开启，同时自动关闭日志体积限制）
DEBUG_MODE=0

# 分区开关（仅 DEBUG_MODE=1 时有效）
DEBUG_SENSOR=1    # 传感器读数
DEBUG_EMERG=1     # 紧急干预
DEBUG_BATT=1      # 电池温度控制
DEBUG_EXEC=1      # 执行下发
DEBUG_CONN=1      # 连接状态
DEBUG_CONFIG=1    # 配置加载
DEBUG_MAIN=1      # 主循环
DEBUG_PID=1       # PID


# [3] 速率限制（所有模式共享）
# 每 5 秒周期最大变化量，三参数独立限速
# 未完成量自然累积到下周期；目标变化时从当前实际值重新计算
RATE_LIMIT_RPM_UP=250    # 风扇 RPM 上升限制（范围 50~2000，升速不宜过快避免噪音突增）
RATE_LIMIT_RPM_DOWN=500 # 风扇 RPM 下降限制（范围 50~2000，降速可以更快一些）
RATE_LIMIT_COLD=20   # 制冷片强度限制（范围 1~194，固定功率模式生效）
RATE_LIMIT_TEMP=2    # 目标温度 °C限制（范围 1~30，智能温控模式生效）


# [4] PID 模式控制（CTRL_MODE=1 启用，默认开启）
# 模式开关
# 0 = 常规模式（走下方 gear 体系，含紧急干预）
# 1 = PID 连续无级调节（跳过全部档位/反补/豁免/电流-挡位逻辑，输入补偿替代紧急机制）
CTRL_MODE=1

# PID 核心参数
# KP（比例）：误差→输出敏感度。÷1000，数值越大误差越早被压制。
#   KP=400(=0.400)：1°C 误差→P=40%输出。调大→升降温都更积极，
#   过大会在目标附近震荡，过小变化速度偏慢（范围 50~2000，推荐 200~500）。
PID_KP=400

# KI（积分）：消除长期静差，±1°C 内才累积（积分分离）。
#   KI=50(=0.050)：累积速率是默认 20 的 2.5 倍，稳态更准。
#   过大降温滞后，过小温差推不动（范围 10~500，推荐 30~80）。
PID_KI=50

# KD（微分）：抑制过冲，温度变化越快出力越大。
#   KD=150(=0.150)：0.5°C/5s 升温→D=-1.5%提前刹车。
#   太大温度抖动大，太小容易过冲（范围 0~500，推荐 100~300）。
PID_KD=150

# 积分上限（÷1000，防饱和，±0.500）
PID_INTEGRAL_LIMIT=500

# 输入/输出滤波
PID_BATT_ALPHA=30      # 电池温度 EMA 滤波（%，新值权重，30=新值占 30%）
PID_OUTPUT_ALPHA=50    # PID 输出 EMA 平滑（%，新值权重，与电池滤波同一语义）

# 输入补偿（方案 A：补偿加到电池温度上，替代紧急机制）
# CPU 补偿：comp = clamp(cpu - batt, 0) / PID_CPU_COMP_DIVISOR，平滑复用 CPU_FILTER_ALPHA（25%）
PID_CPU_COMP_ENABLED=1       # CPU 补偿开关（=1 启用）
PID_CPU_COMP_DIVISOR=30      # (cpu-batt 0.1°C)÷divisor→0.1°C，范围 5~200

# 电流补偿：反映高负载放电时电池自发热
# 阈值内不补偿，超过后 |A| / PID_CURR_COMP_DIVISOR，平滑复用 CURRENT_GEAR_SMOOTH_ALPHA（25%）
PID_CURR_COMP_ENABLED=1      # 电流补偿开关（=1 启用）
PID_CURR_COMP_THRESHOLD=200  # 电流阈值（0.01A，200=2A），范围 50~1000
PID_CURR_COMP_DIVISOR=2      # |A|÷divisor→°C，范围 1~50

# 制冷强度范围
PID_COLD_MIN=1         # 制冷片强度下限
PID_COLD_MAX=190       # 制冷片强度上限

# 制冷→风扇映射（指数曲线）
PID_COLD_EXP=150       # n^exp（÷100，150=1.50），>1 低冷慢转
PID_RPM_MIN=2000       # 最低风扇转速
PID_RPM_MAX=6000       # 最高风扇转速

# 热端线性映射范围
PID_HOT_MAP_MIN=350    # 热端映射最低温度（0.1°C），低于此值→PID_RPM_MIN
PID_HOT_MAP_MAX=450    # 热端映射最高温度（0.1°C），高于此值→PID_RPM_MAX


# [5] Gear 模式 — 电池控制（CTRL_MODE=0 时生效）
# 5a. 基础电池温度调档
# 基准温度，电池温度与此值计算偏差
BATT_BASELINE=350

# 三区间阈值（|偏差|≤Z1 死区，≤Z2 ±1 档，≤Z3 ±2 档，>Z3 ±3 档）
BATT_ZONE_1=5
BATT_ZONE_2=13
BATT_ZONE_3=25

# 档位变动冷却（每次任意原因导致的档位变动后冻结 N 周期 ×5 秒），紧急不受限
BATT_COOLDOWN_CYCLES=3

# 电池温度连续不变最多跳过 N 次 battery_control，超限后强制进入
BATT_SKIP_MAX=6

# 5b. 电流-挡位映射 + 温度偏移累积
# 电流-挡位映射开关（第一位充电，第二位放电。0=仅普通电池温度，1=电流映射推荐挡位）
CURRENT_GEAR_MODE=1 1

# 推荐档位 = 平滑电流(0.01A) × 倍率 ÷ 100，温度在此基础累积偏移（带冷却）
CURRENT_GEAR_MULT_CHARGE=2      # 充电倍率（如 3A×2=6 档）
CURRENT_GEAR_MULT_DISCHARGE=6   # 放电倍率（如 8A×6 并 clamp 到 max 档）

# 电流平滑系数（百分比，1~100）
CURRENT_GEAR_SMOOTH_ALPHA=25

# 推荐档位低于此值时回退到基准（电池温度）模式
CURRENT_GEAR_MIN=6

# 5c. 趋势豁免 / 过冲反补
# 反补独立开关（=0 禁用过冲反补查表）
REV_COMP_ENABLED=1

# 趋势豁免独立开关（=0 禁用趋势豁免）
TREND_EXEMPT_ENABLED=1

# 三级阈值 × 三区 × 双向查表，按每周期速率归一化
# 阈值表示"每周期温度变化量"，如 2 = 0.2°C/5s
# 传感器跳变时温差 ÷ 周期数 归一化后再查表
# 默认 2/3/4 = 0.2°C / 0.3°C / 0.4°C 每周期
REV_COMP_T1=2
REV_COMP_T2=3
REV_COMP_T3=4

# 反补冷却周期数（反补生效后冻结 N 周期，期内累积温差，到期合并计算）
REV_COMP_COOLDOWN=1

# 趋势豁免锚点复位参数（首次豁免记录当前电池温度为锚点，
# 以区间中值为偏移量计算复位阈值，越过则复位豁免计数器）
OVERRIDE_MAX=6


# [6] Gear 模式 — 紧急干预（CTRL_MODE=0 时生效）
# CPU 温度紧急独立开关（=0 禁用）
EMERG_CPU_ENABLED=1

# 电流紧急独立开关（=0 禁用）
EMERG_CURRENT_ENABLED=0

# 紧急干预模式（两数字：第一位升档，第二位降档。0=表查，1=步进）
EMERG_MODE=0 1

# 6a. CPU 温度
# CPU 加权温度阈值（配合电流 OR 入 AND 出）
CPU_EMERG_3=850   # >85.0°C → 紧急等级 3
CPU_EMERG_2=750   # >75.0°C → 紧急等级 2
CPU_EMERG_1=650   # >65.0°C → 紧急等级 1
CPU_RECOVER_2=750 # <75.0°C → 降为 2
CPU_RECOVER_1=650 # <65.0°C → 降为 1
CPU_RECOVER_0=550 # <55.0°C → 退出紧急

# CPU 温度平滑系数（百分比，越大越跟原始值，越小越平滑）
CPU_FILTER_ALPHA=25

# 6b. 电池电流
# 读取后 ÷10000 转 0.01A 单位，进入不平滑，退出用 EMA
# 进入：CPU OR 电流超阈即触发；退出：CPU AND 电流都低于恢复阈值才降级
CURRENT_EMERG_3=700      # >7.00A → 紧急等级 3
CURRENT_EMERG_2=600      # >6.00A → 紧急等级 2
CURRENT_EMERG_1=500      # >5.00A → 紧急等级 1
CURRENT_RECOVER_2=600    # <6.00A → 从 3 降为 2
CURRENT_RECOVER_1=500    # <5.00A → 从 2 降为 1
CURRENT_RECOVER_0=400    # <4.00A → 退出紧急

# 电流退出 EMA 平滑系数（升档时重置，降档退出前持续累积）
CURRENT_SMOOTH_ALPHA=25

# 6c. 强制最低档位 & 退出
# 升档模式=0 时查下表，模式=1 时使用 EMERG_STEP×等级 计算
EMERG_FORCED_4=12   # 等级 4 强制最低档（6000RPM/190，制冷峰值）
EMERG_FORCED_3=10   # 等级 3（5000RPM/165）
EMERG_FORCED_2=8    # 等级 2（4000RPM/125）
EMERG_FORCED_1=6    # 等级 1（3050RPM/75）

# 退出钳制偏移量（cap = 高一级最低档 + 此值），仅降档模式=0 生效
EMERG_EXIT_CAP_OFFSET=1

# 升/降档步数，模式=1 时生效
EMERG_STEP=2

# 电池温度低于基准+此值 → 全效退出，低于基准+此值×2 → 半效退出
EMERG_EXIT_BATT_THRESHOLD=20

# 紧急退出恢复期
# 退出紧急后调档阈值逐步恢复：M1×6 → M2×4 → M3×2 → 1（正常）
# 每阶段持续 BATT_RECOVERY_PHASE_CYCLES 周期，连续退出重启，重新进入取消
BATT_RECOVERY_M1=6
BATT_RECOVERY_M2=4
BATT_RECOVERY_M3=2
BATT_RECOVERY_PHASE_CYCLES=6


# [7] Gear 模式 — 挡位表（CTRL_MODE=0 时可选生效）
# 独立开关：=1 时使用下方 GEAR_N，=0 使用代码默认表
GEAR_CONFIG_ENABLED=0

# GEAR_N=模式,目标温度(°C),风扇RPM,制冷强度
#  模式=0(智能温控)：targetTemperature + windLevel(风扇上限)
#  模式=1(固定功率)：windLevelOverclock(风扇固定) + coldLevelOverclock(制冷强度)
# 范围：N=1~32, 模式=0/1, 目标=5~35°C, 风扇=2000~6000RPM, 制冷=1~194
# 说明1：智能温控风扇上限疑似非强制生效，易导致噪音突增，不建议使用
# 说明2：b6x 最高制冷量区间为 180~200，再高因鳍片解热不足反而倒退
GEAR_12=1,0,6000,190
GEAR_11=1,0,5500,180
GEAR_10=1,0,5000,165
GEAR_9=1,0,4500,145
GEAR_8=1,0,4000,125
GEAR_7=1,0,3500,100
GEAR_6=1,0,3050,75
GEAR_5=1,0,2650,55
GEAR_4=1,0,2300,35
GEAR_3=1,0,2000,20
GEAR_2=1,0,2000,10
GEAR_1=1,0,2000,5