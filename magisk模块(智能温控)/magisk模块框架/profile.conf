#   升温默认10（全效），降温默认5（半效）；抑制系数默认50=×0.5，0=完全抑制=停止
#   稳定性闸门：两点变化率 < GEAR_PREDICT_RISE 第三值时不停止，仅预测增量 × 抑制系数
GEAR_PREDICT_WEIGHT=10 5 50

# 预测窗口（三值：缓冲区大小 最大计算窗口 最小计算窗口，3~32/3~10/2~5）
GEAR_PREDICT_WIN=10 5 2

# 预测上升限制（三值：最大温升限制，最小启动周期，启动阈值（0.1°C））
GEAR_PREDICT_RISE=20 3 2

# 预测平滑系数（%，越大越跟随原始预测值，越小越平滑）
GEAR_PREDICT_ALPHA=33

# --- 电流-挡位映射 + 温度偏移累积 ---
# 电流-挡位映射开关（第一位充电，第二位放电。0=仅普通电池温度，1=电流映射推荐挡位）
CURRENT_GEAR_MODE=1 1

# 推荐档位 = 滤波电流(0.01A) × 倍率 ÷ 100，温度在此基础累积偏移（带冷却）
