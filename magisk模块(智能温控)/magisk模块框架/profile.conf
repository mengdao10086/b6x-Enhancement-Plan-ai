# 飞智 B6X 增强计划 — 智能温控配置
# 格式：KEY=VALUE（等号两边不要空格），# 开头为注释，空行自动跳过
# 修改后无需重启 daemon，下一轮 5 秒循环自动热重载


# 配置文件的全局开关（包括挡位表）
# =0：不加载以下任何参数，全部使用代码内默认值
# =1：正常加载以下所有参数
CONFIG_ENABLED=0

# [0] sysfs 路径与缩放
# 传感器 sysfs 路径，不同机型可能位置不同，可自行修改
# 缩放系数 = 原始值 ÷ 缩放系数 → 内部单位（0.1°C / µA）
# 以下内容为 k60 机型推荐值，其他小米系应该也能用，其他品牌机型请自行测试
# 电池温度
BATT_TEMP_PATH=/sys/class/power_supply/battery/temp
BATT_TEMP_DIVISOR=1

# CPU 温度
# %d 会被替换为目标范围的 thermal_zone 编号
CPU_TEMP_PATH_FMT=/sys/class/thermal/thermal_zone%d/temp
CPU_TEMP_DIVISOR=100

# 电池电流
BATT_CURRENT_PATH=/sys/class/power_supply/battery/current_now
BATT_CURRENT_DIVISOR=1

# [1] 电池温度控制
# 基准温度，电池温度与此值比较算偏差
BATT_BASELINE=350

# 第一区间阈值，|偏差|≤此值时不调整（死区），避免小幅波动频繁换挡
BATT_ZONE_1=5

# 第二区间阈值
# 死区 < |偏差| ≤ 此值 → ±1 档，|偏差| > 此值 → ±2 档
BATT_ZONE_2=15

# 档位变动冷却（每次任意原因导致的档位变动后冻结周期数，×5秒）
# 期内跳过因电池温度触发的常规升降档（峰值反补和紧急干预不受限）
BATT_COOLDOWN_CYCLES=3

# 温度不变最大跳过次数（0=关闭强制进入，30=最大）
# 电池温度连续不变时最多跳过 N 次 battery_control，超限后强制进入一次
BATT_SKIP_MAX=6

# [2] 反补查表三级阈值
# 三区×双向×三级阈值查表法，t1/t2/t3 分别对应 +1/+2/+3 档的 ΔT 门槛
# 单位：0.1°C，默认 3/5/8 = 0.3°C / 0.5°C / 0.8°C
# 升温分配：冷外 t3/ 内 t2/t3/ 热 t1/t2/t3
# 降温分配：冷 t1/t2/t3/ 内 t2/t3/ 热 t1
REV_COMP_T1=3
REV_COMP_T2=5
REV_COMP_T3=8

# 最大连续豁免次数（0=关闭豁免，20=最大）
OVERRIDE_MAX=6

# [3] 逐档提升启动档位
# ≤此档位时提升可直接跳转（不逐级），>此档位时每轮最多 +1 档
# 降档始终逐级（每轮 -1 档），不受此限制
GRADUAL_STEP_THRESHOLD=5

# [4] CPU 温度紧急干预
# CPU 温度扫描范围，首次运行在/sys/class/thermal/thermal_zone${i}/temp的此范围内扫描有效的 zone，后续只扫命中的 zone
# 脚本默认 0~99 全量扫描。以下 30~40 为 K60 机型推荐值，其他机型请自行测试，或在启用配置时改回全量扫描
CPU_ZONE_MIN=30
CPU_ZONE_MAX=40

# CPU 加权温度超过以下阈值时触发紧急等级（配合电流 OR 入 AND 出）
# >85.0°C → 紧急等级 3
CPU_EMERG_3=850
# >75.0°C → 紧急等级 2
CPU_EMERG_2=750
# >65.0°C → 紧急等级 1
CPU_EMERG_1=650
# <75.0°C → 降为 2
CPU_RECOVER_2=750
# <65.0°C → 降为 1
CPU_RECOVER_1=650
# <55.0°C → 退出紧急
CPU_RECOVER_0=550

# CPU 温度平滑系数（百分比，1~100）
# weighted = raw × α% + old × (100-α)%，越大越跟原始值，越小越平滑，但反应也越慢
CPU_FILTER_ALPHA=25

# [5] 电流紧急干预
# 电流读取 /sys/class/power_supply/battery/current_now，取绝对值（充放电都算）
# 进入时用原始值（不平滑），退出时用 EMA 平滑值
# 进入条件：CPU 温度 OR 电池电流其中一个超过阈值即触发
# 退出条件：CPU 温度 AND 电池电流都低于恢复阈值才降级
# 单位：微安（µA），1000000 = 1A
# >7A 进入紧急等级 3
CURRENT_EMERG_3=7000000
# >6A 进入紧急等级 2
CURRENT_EMERG_2=6000000
# >5A 进入紧急等级 1
CURRENT_EMERG_1=5000000
# <6A 从等级 3 降为 2
CURRENT_RECOVER_2=6000000
# <5A 从等级 2 降为 1
CURRENT_RECOVER_1=5000000
# <4A 退出紧急
CURRENT_RECOVER_0=4000000

# 电流退出 EMA 平滑系数（百分比，1~100），计算公式同cpu温度
# 仅在紧急退出判断时生效；升档（等级提高）时重置平滑
CURRENT_SMOOTH_ALPHA=25

# 紧急强制最低档位（综合等级 = cpu_level + current_level，各自 0~3）
# 单源最高 3 级，4 级需双源叠加
# 等级 4 强制最低档（固定 6000RPM/190，制冷峰值）
EMERG_FORCED_4=12
# 等级 3 强制最低档（固定 5000RPM/165）
EMERG_FORCED_3=10
# 等级 2 强制最低档（固定 4000RPM/125）
EMERG_FORCED_2=8
# 等级 1 强制最低档（固定 3050RPM/75）
EMERG_FORCED_1=6

# 紧急退出档位钳制偏移量
# 退出时 cap = 高一级最低档位 + 此偏移量
EMERG_EXIT_CAP_OFFSET=1

# [7] 进程检测
# LSPosed 模块最后一次写 status 文件超过此秒数 → 判进程死
STATUS_TIMEOUT=11

# [8] 日志
# 日志文件路径（空字符串或省略则自动根据二进制名在/cache/目录生成）
LOG_FILE=/cache/tempctrl.log

# 日志文件大小上限（KB），超限自动删除最早日志行，0=关闭日志
LOG_MAX_KB=7


# 档位表独立开关（=0 时忽略下方所有 GEAR_N，使用代码默认档位表）
# =1 时且下方有 GEAR_N 行，档位表完全由此定义（不再使用默认表）
GEAR_CONFIG_ENABLED=0

# 格式：GEAR_<档位N>=<模式>,<目标温度°C>,<风扇RPM>,<制冷强度>（模式0时制冷强度失效，模式1时目标温度无效）
# 范围：N=1~32, 模式=0(智能)或1(固定), 目标=5~35°C, 风扇=2000~6000, 制冷=1~194
# 另外说明1：智能温控风扇上限疑似非强制生效，容易导致噪音突增，一般不建议使用
# 另外说明2：b6x最高制冷量区间为180-200，更高值鳍片解热能力不足，反而会倒退
GEAR_12=1,0,6000,190
GEAR_11=1,0,5500,180
GEAR_10=1,0,5000,165
GEAR_9=1,0,4500,145
GEAR_8=1,0,4000,125
GEAR_7=1,0,3500,100
GEAR_6=1,0,3050,75
GEAR_5=1,0,2650,55
GEAR_4=1,0,2300,35
GEAR_3=1,0,2000,20
GEAR_2=1,0,2000,10
GEAR_1=1,0,2000,5
