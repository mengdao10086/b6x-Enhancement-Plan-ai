<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>飞智B6X 智能温控</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#1a1a2e;--card:#16213e;--surface:#0f3460;--accent:#e94560;--accent2:#53d769;--text:#eee;--text2:#aaa;--border:#2a2a4a;--radius:10px;--gap:8px}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;height:100dvh;display:flex;flex-direction:column}
#app{display:flex;flex-direction:column;height:100dvh}

/* Header */
header{background:var(--card);padding:12px 16px;text-align:center;font-size:16px;font-weight:600;border-bottom:1px solid var(--border);flex-shrink:0}
header small{display:block;font-size:11px;color:var(--text2);font-weight:400;margin-top:2px}

/* Config area — scrollable top half */
#configArea{flex:1;overflow-y:auto;padding:var(--gap);display:flex;flex-direction:column;gap:var(--gap);min-height:0}

/* Section card */
section{background:var(--card);border-radius:var(--radius);overflow:hidden}
.section-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;cursor:pointer;user-select:none;border-bottom:1px solid transparent}
.section-header:active{opacity:.7}
.section-header .label{font-size:13px;font-weight:500}
.section-header .hint{font-size:10px;color:var(--text2);margin-top:1px}
.section-body{padding:2px 14px 10px;display:none}
.section-body.open{display:block}

/* Toggle switch */
.switch-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}
.switch-row:last-child{border-bottom:none}
.switch-row .label{font-size:13px;flex:1}
.switch-row .label small{display:block;font-size:10px;color:var(--text2);margin-top:1px}
.toggle{position:relative;width:44px;height:24px;flex-shrink:0;margin-left:12px}
.toggle input{opacity:0;width:0;height:0}
.toggle .slider{position:absolute;cursor:pointer;inset:0;background:#444;border-radius:12px;transition:.3s}
.toggle .slider::before{content:"";position:absolute;height:18px;width:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s}
.toggle input:checked+.slider{background:var(--accent2)}
.toggle input:checked+.slider::before{transform:translateX(20px)}

/* Number input row */
.input-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border)}
.input-row:last-child{border-bottom:none}
.input-row .label{font-size:12px;flex:1}
.input-row .label small{display:block;font-size:10px;color:var(--text2)}
.input-row input[type=number]{width:90px;padding:5px 8px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);font-size:13px;text-align:right;-moz-appearance:textfield}
.input-row input[type=number]::-webkit-outer-spin-button,.input-row input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

/* Log panel */
#logPanel{flex-shrink:0;height:45dvh;min-height:120px;background:var(--card);border-top:2px solid var(--accent);display:flex;flex-direction:column;transition:height .3s}
#logPanel.fullscreen{position:fixed;inset:0;z-index:100;height:100dvh!important;border-top:none}
.log-header{display:flex;align-items:center;justify-content:space-between;padding:6px 14px;background:var(--surface);flex-shrink:0;font-size:12px;cursor:ns-resize}
.log-header button{background:var(--accent);color:#fff;border:none;border-radius:5px;padding:3px 10px;font-size:11px;cursor:pointer}
.log-header button:active{opacity:.7}
#logContent{flex:1;overflow-y:auto;padding:6px 10px;font-family:monospace;font-size:10px;line-height:1.5;color:#8f8;white-space:pre-wrap;word-break:break-all;background:#0d0d1a}

/* Section divider */
.section-divider{font-size:10px;color:var(--text2);padding:4px 14px 2px;text-transform:uppercase;letter-spacing:1px}

/* Status bar */
#statusBar{text-align:center;font-size:10px;color:var(--text2);padding:4px;background:var(--card);flex-shrink:0}
#statusBar.error{color:var(--accent)}
#statusBar.ok{color:var(--accent2)}

/* saving overlay */
#saving{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center;font-size:16px}
#saving.show{display:flex}
</style>
</head>
<body>
<div id="app">
  <header>
    飞智B6X 智能温控
    <small id="headerSub">加载中...</small>
  </header>

  <div id="configArea"></div>

  <div id="logPanel">
    <div class="log-header">
      <span>📋 运行日志</span>
      <button id="fullscreenBtn" onclick="toggleLogFullscreen()">⛶ 全屏</button>
    </div>
    <pre id="logContent">等待日志...</pre>
  </div>

  <div id="statusBar">就绪</div>
</div>

<div id="saving"><span>保存中...</span></div>

<script type="module">
import { exec } from 'kernelsu';

// ======================== 常量 ========================
const CONFIG_PATH = '/data/adb/modules/b6x-Enhancement-Plan/profile.conf';
const LOG_PATH = '/cache/tempctrl.log';
const LOG_TAIL = 80;  // 读取最后 N 行
const POLL_LOG_MS = 2500;
const POLL_CONFIG_MS = 5000;

// ======================== 配置定义 ========================
// 每个配置项的元信息：key, 默认值, 标签, 说明, 类型(group/master/toggle/number), 子组, 范围
const CONFIG_SCHEMA = [
  // ── 系统控制 ──
  { key:'PERF_ENABLED', type:'master', label:'PERF_ENABLED', hint:'性能参数总开关', group:'perf', default:0 },

  // ── 日志调试（属于 DEBUG 组）──
  { key:'DEBUG_ENABLED', type:'master', label:'DEBUG_ENABLED', hint:'调试日志总开关', group:'debug', default:0 },
  { key:'DEBUG_SENSOR', type:'toggle', label:'DEBUG_SENSOR', hint:'传感器读数', group:'debug_sub', depends:'DEBUG_ENABLED', default:0 },
  { key:'DEBUG_EMERG', type:'toggle', label:'DEBUG_EMERG', hint:'紧急干预', group:'debug_sub', depends:'DEBUG_ENABLED', default:0 },
  { key:'DEBUG_BATT', type:'toggle', label:'DEBUG_BATT', hint:'电池温度控制', group:'debug_sub', depends:'DEBUG_ENABLED', default:0 },
  { key:'DEBUG_EXEC', type:'toggle', label:'DEBUG_EXEC', hint:'执行下发', group:'debug_sub', depends:'DEBUG_ENABLED', default:0 },
  { key:'DEBUG_CONN', type:'toggle', label:'DEBUG_CONN', hint:'连接状态', group:'debug_sub', depends:'DEBUG_ENABLED', default:0 },
  { key:'DEBUG_CONFIG', type:'toggle', label:'DEBUG_CONFIG', hint:'配置加载', group:'debug_sub', depends:'DEBUG_ENABLED', default:0 },
  { key:'DEBUG_MAIN', type:'toggle', label:'DEBUG_MAIN', hint:'主循环', group:'debug_sub', depends:'DEBUG_ENABLED', default:0 },
  { key:'DEBUG_PID', type:'toggle', label:'DEBUG_PID', hint:'PID', group:'debug_sub', depends:'DEBUG_ENABLED', default:0 },
  { key:'LOG_MAX_KB', type:'number', label:'LOG_MAX_KB', hint:'日志大小上限 KB', group:'debug', depends:'PERF_ENABLED', min:0, max:1000, default:7 },
  { key:'LOG_TRIM_LINES', type:'number', label:'LOG_TRIM_LINES', hint:'超限删除最早 N 行', group:'debug', depends:'PERF_ENABLED', min:0, max:50, default:3 },

  // ── 通用参数 ──
  { key:'BATT_BASELINE', type:'number', label:'BATT_BASELINE', hint:'电池基准温度(0.1°C)', group:'common', depends:'PERF_ENABLED', min:300, max:500, default:350 },
  { key:'CTRL_MODE', type:'toggle', label:'CTRL_MODE', hint:'0=Gear挡位 / 1=PID无级', group:'common', depends:'PERF_ENABLED', default:1 },
  { key:'HOT_MAP_MIN', type:'number', label:'HOT_MAP_MIN', hint:'热端映射最低温度(0.1°C)', group:'common', depends:'PERF_ENABLED', min:200, max:500, default:350 },
  { key:'HOT_MAP_MAX', type:'number', label:'HOT_MAP_MAX', hint:'热端映射最高温度(0.1°C)', group:'common', depends:'PERF_ENABLED', min:200, max:500, default:450 },
  { key:'COLD_MAP_START', type:'number', label:'COLD_MAP_START', hint:'冷端映射起始强度', group:'common', depends:'PERF_ENABLED', min:0, max:194, default:40 },
  { key:'COLD_MAP_EXP', type:'number', label:'COLD_MAP_EXP', hint:'冷端指数 n^exp(÷100)', group:'common', depends:'PERF_ENABLED', min:50, max:500, default:150 },
  { key:'FAN_RPM_MIN', type:'number', label:'FAN_RPM_MIN', hint:'最低风扇 RPM', group:'common', depends:'PERF_ENABLED', min:1000, max:6000, default:2000 },
  { key:'FAN_RPM_MAX', type:'number', label:'FAN_RPM_MAX', hint:'最高风扇 RPM', group:'common', depends:'PERF_ENABLED', min:1000, max:6000, default:6000 },
  { key:'FAN_RPM_CHANGE_THRESHOLD', type:'number', label:'FAN_RPM_CHANGE_THRESHOLD', hint:'风扇目标变化阈值 RPM(0=不限)', group:'common', depends:'PERF_ENABLED', min:0, max:2000, default:100 },

  // ── 速率限制 ──
  { key:'RATE_LIMIT_RPM_UP', type:'number', label:'RATE_LIMIT_RPM_UP', hint:'风扇升速每周期(RPM)', group:'rate', depends:'PERF_ENABLED', min:50, max:2000, default:250 },
  { key:'RATE_LIMIT_RPM_DOWN', type:'number', label:'RATE_LIMIT_RPM_DOWN', hint:'风扇降速每周期(RPM)', group:'rate', depends:'PERF_ENABLED', min:50, max:2000, default:250 },
  { key:'RATE_LIMIT_COLD', type:'number', label:'RATE_LIMIT_COLD', hint:'制冷强度每周期', group:'rate', depends:'PERF_ENABLED', min:1, max:194, default:20 },
  { key:'RATE_LIMIT_TEMP', type:'number', label:'RATE_LIMIT_TEMP', hint:'目标温度每周期(°C)', group:'rate', depends:'PERF_ENABLED', min:1, max:30, default:2 },

  // ── PID 参数 ──
  { key:'PID_KP', type:'number', label:'PID_KP', hint:'比例系数(÷1000)', group:'pid', depends:'PERF_ENABLED', ctrlDep:'CTRL_MODE=1', min:1, max:1000, default:300 },
  { key:'PID_KI', type:'number', label:'PID_KI', hint:'积分系数(÷1000)', group:'pid', depends:'PERF_ENABLED', ctrlDep:'CTRL_MODE=1', min:0, max:1000, default:50 },
  { key:'PID_KD', type:'number', label:'PID_KD', hint:'微分系数(÷1000)', group:'pid', depends:'PERF_ENABLED', ctrlDep:'CTRL_MODE=1', min:0, max:1000, default:240 },
  { key:'PID_KI_VAR_THRESHOLD', type:'number', label:'PID_KI_VAR_THRESHOLD', hint:'方差门控阈值(0.1°C²)', group:'pid', depends:'PERF_ENABLED', ctrlDep:'CTRL_MODE=1', min:0, max:200, default:25 },
  { key:'PID_KI_VAR_SAMPLES', type:'number', label:'PID_KI_VAR_SAMPLES', hint:'方差采样数(2~20)', group:'pid', depends:'PERF_ENABLED', ctrlDep:'CTRL_MODE=1', min:2, max:20, default:6 },
  { key:'PID_KI_DEADBAND', type:'number', label:'PID_KI_DEADBAND', hint:'积分分离死区(0.1°C)', group:'pid', depends:'PERF_ENABLED', ctrlDep:'CTRL_MODE=1', min:0, max:100, default:15 },
  { key:'PID_INTEGRAL_LIMIT', type:'number', label:'PID_INTEGRAL_LIMIT', hint:'积分上限(÷1000)', group:'pid', depends:'PERF_ENABLED', ctrlDep:'CTRL_MODE=1', min:0, max:1000, default:500 },
  { key:'PID_BATT_ALPHA', type:'number', label:'PID_BATT_ALPHA', hint:'电池滤波系数(% 新值权重)', group:'pid', depends:'PERF_ENABLED', ctrlDep:'CTRL_MODE=1', min:1, max:100, default:33 },
  { key:'PID_INPUT_FILTER_ENABLED', type:'toggle', label:'PID_INPUT_FILTER_ENABLED', hint:'PID 输入滤波开关', group:'pid', depends:'PERF_ENABLED', ctrlDep:'CTRL_MODE=1', default:1 },
  { key:'PID_COLD_MIN', type:'number', label:'PID_COLD_MIN', hint:'制冷强度下限', group:'pid', depends:'PERF_ENABLED', ctrlDep:'CTRL_MODE=1', min:0, max:194, default:1 },
  { key:'PID_COLD_MAX', type:'number', label:'PID_COLD_MAX', hint:'制冷强度上限', group:'pid', depends:'PERF_ENABLED', ctrlDep:'CTRL_MODE=1', min:0, max:194, default:190 },
  { key:'PID_CPU_COMP_ENABLED', type:'toggle', label:'PID_CPU_COMP_ENABLED', hint:'CPU 补偿开关', group:'pid', depends:'PERF_ENABLED', ctrlDep:'CTRL_MODE=1', default:1 },
  { key:'PID_CPU_COMP_DIVISOR', type:'number', label:'PID_CPU_COMP_DIVISOR', hint:'CPU 补偿系数', group:'pid', depends:'PERF_ENABLED', ctrlDep:'CTRL_MODE=1', min:5, max:200, default:30 },

  // ── Gear 参数 ──
  { key:'BATT_BOUNDARY_1', type:'number', label:'BATT_BOUNDARY_1', hint:'第一区间阈值(0.1°C) 死区', group:'gear', depends:'PERF_ENABLED', ctrlDep:'CTRL_MODE=0', min:1, max:100, default:5 },
  { key:'BATT_BOUNDARY_2', type:'number', label:'BATT_BOUNDARY_2', hint:'第二区间阈值(0.1°C)', group:'gear', depends:'PERF_ENABLED', ctrlDep:'CTRL_MODE=0', min:1, max:100, default:13 },
  { key:'BATT_BOUNDARY_3', type:'number', label:'BATT_BOUNDARY_3', hint:'第三区间阈值(0.1°C)', group:'gear', depends:'PERF_ENABLED', ctrlDep:'CTRL_MODE=0', min:1, max:100, default:25 },
  { key:'BATT_COOLDOWN_CYCLES', type:'number', label:'BATT_COOLDOWN_CYCLES', hint:'档位变动冷却(周期)', group:'gear', depends:'PERF_ENABLED', ctrlDep:'CTRL_MODE=0', min:0, max:20, default:3 },
  { key:'GEAR_AUTO_FAN', type:'toggle', label:'GEAR_AUTO_FAN', hint:'挡位模式自动风扇转速', group:'gear', depends:'PERF_ENABLED', ctrlDep:'CTRL_MODE=0', default:1 },
  { key:'CURRENT_GEAR_MODE', type:'text', label:'CURRENT_GEAR_MODE', hint:'充电 放电 开关(0/1)', group:'gear', depends:'PERF_ENABLED', ctrlDep:'CTRL_MODE=0', default:'1 1' },
  { key:'CPU_FILTER_ALPHA', type:'number', label:'CPU_FILTER_ALPHA', hint:'CPU 滤波系数(%)', group:'gear', depends:'PERF_ENABLED', ctrlDep:'CTRL_MODE=0', min:1, max:100, default:25 },
  { key:'EMERG_CPU_ENABLED', type:'toggle', label:'EMERG_CPU_ENABLED', hint:'CPU 紧急开关', group:'gear', depends:'PERF_ENABLED', ctrlDep:'CTRL_MODE=0', default:1 },
  { key:'EMERG_CURRENT_ENABLED', type:'toggle', label:'EMERG_CURRENT_ENABLED', hint:'电流紧急开关', group:'gear', depends:'PERF_ENABLED', ctrlDep:'CTRL_MODE=0', default:0 },
];

// 分组定义（显示用）
const GROUPS = [
  { id:'perf', label:'系统控制' },
  { id:'debug', label:'日志 & 调试' },
  { id:'common', label:'通用参数' },
  { id:'rate', label:'速率限制' },
  { id:'pid', label:'PID 参数' },
  { id:'gear', label:'Gear 参数' },
];

// ======================== 状态 ========================
let configValues = {};        // key → string value from file
let configDirty = {};         // key → true when user changed
let logAutoScroll = true;
let logFullscreen = false;
let saveTimer = null;

// ======================== DOM 引用 ========================
const configArea = document.getElementById('configArea');
const logContent = document.getElementById('logContent');
const statusBar = document.getElementById('statusBar');
const headerSub = document.getElementById('headerSub');
const saving = document.getElementById('saving');
const logPanel = document.getElementById('logPanel');

// ======================== 工具函数 ========================
function setStatus(msg, type) {
  statusBar.textContent = msg;
  statusBar.className = type || '';
}

function escapeShell(str) {
  return str.replace(/'/g, "'\\''");
}

function showSaving(show) {
  saving.classList.toggle('show', show);
}

// ======================== 配置读写 ========================
async function readConfig() {
  try {
    const { stdout } = await exec(`cat '${CONFIG_PATH}'`);
    const lines = stdout.split('\n');
    const vals = {};
    for (const line of lines) {
      const trimmed = line.trim();
      if (!trimmed || trimmed.startsWith('#')) continue;
      const eq = trimmed.indexOf('=');
      if (eq < 1) continue;
      const key = trimmed.substring(0, eq).trim();
      const val = trimmed.substring(eq + 1).trim();
      if (key) vals[key] = val;
    }
    configValues = vals;
    return vals;
  } catch (e) {
    setStatus('读取配置失败: ' + e.message, 'error');
    return {};
  }
}

async function writeConfig(key, value) {
  try {
    const sv = escapeShell(String(value));
    // 用 sed 替换（路径值含 / 时使用 | 分隔符）
    await exec(`
      if grep -q '^${key}=' '${CONFIG_PATH}' 2>/dev/null; then
        sed -i 's|^${key}=.*|${key}=${sv}|' '${CONFIG_PATH}'
      else
        echo '${key}=${sv}' >> '${CONFIG_PATH}'
      fi
    `);
    // 触发热重载
    await exec(`touch '${CONFIG_PATH}'`);
    configValues[key] = String(value);
    return true;
  } catch (e) {
    setStatus(`保存 ${key} 失败: ${e.message}`, 'error');
    return false;
  }
}

// ======================== 界面渲染 ========================
function renderConfig(vals) {
  const ctrlMode = vals['CTRL_MODE'] === '1';
  const perfOn = vals['PERF_ENABLED'] === '1';
  const debugOn = vals['DEBUG_ENABLED'] === '1';

  let html = '';

  for (const group of GROUPS) {
    const items = CONFIG_SCHEMA.filter(i => i.group === group.id);
    if (!items.length) continue;

    // DEP visibility: PID/Gear 互斥
    const pidSection = group.id === 'pid';
    const gearSection = group.id === 'gear';
    if (pidSection && !ctrlMode) continue;
    if (gearSection && ctrlMode) continue;

    html += `<section><div class="section-header" onclick="toggleSection(this)">
      <div><div class="label">${group.label}</div></div><span>▸</span>
    </div><div class="section-body">`;

    for (const item of items) {
      // DEP visibility: PERF_ENABLED
      if (item.depends === 'PERF_ENABLED' && !perfOn) continue;
      // DEP visibility: DEBUG_ENABLED
      if (item.depends === 'DEBUG_ENABLED' && !debugOn) continue;

      const val = vals[item.key] ?? String(item.default);

      if (item.type === 'master' || item.type === 'toggle') {
        const checked = val === '1' ? 'checked' : '';
        html += `<div class="switch-row">
          <div class="label">${item.label}<small>${item.hint || ''}</small></div>
          <label class="toggle">
            <input type="checkbox" data-key="${item.key}" ${checked}>
            <span class="slider"></span>
          </label>
        </div>`;
      } else if (item.type === 'number') {
        html += `<div class="input-row">
          <div class="label">${item.label}<small>${item.hint || ''}</small></div>
          <input type="number" data-key="${item.key}"
            min="${item.min}" max="${item.max}" value="${val}">
        </div>`;
      } else if (item.type === 'text') {
        html += `<div class="input-row">
          <div class="label">${item.label}<small>${item.hint || ''}</small></div>
          <input type="text" data-key="${item.key}" value="${escapeShell(val)}"
            style="width:100px;padding:5px 8px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);font-size:12px;text-align:right">
        </div>`;
      }
    }

    html += '</div></section>';
  }

  configArea.innerHTML = html;

  // ── 绑定事件 ──
  // 开关
  configArea.querySelectorAll('input[type=checkbox]').forEach(el => {
    el.addEventListener('change', async () => {
      const key = el.dataset.key;
      const val = el.checked ? '1' : '0';
      showSaving(true);
      await writeConfig(key, val);
      showSaving(false);
      setStatus(`已保存 ${key}=${val}`, 'ok');
      // 主开关变化后重绘
      if (key === 'PERF_ENABLED' || key === 'DEBUG_ENABLED' || key === 'CTRL_MODE') {
        renderConfig({...configValues});
        // 重新展开之前展开的组…
        document.querySelectorAll('.section-body').forEach(b => b.classList.add('open'));
      }
    });
  });

  // 数字/文本输入（防抖保存）
  configArea.querySelectorAll('input[type=number], input[type=text]').forEach(el => {
    el.addEventListener('change', async () => {
      const key = el.dataset.key;
      const val = el.value;
      showSaving(true);
      await writeConfig(key, val);
      showSaving(false);
      setStatus(`已保存 ${key}=${val}`, 'ok');
    });
    // Enter 保存
    el.addEventListener('keydown', async (e) => {
      if (e.key === 'Enter') {
        el.blur();
        const key = el.dataset.key;
        const val = el.value;
        showSaving(true);
        await writeConfig(key, val);
        showSaving(false);
        setStatus(`已保存 ${key}=${val}`, 'ok');
      }
    });
  });

  // 默认展开所有可见组
  document.querySelectorAll('.section-body').forEach(b => b.classList.add('open'));
}

// 折叠/展开
window.toggleSection = function(header) {
  const body = header.nextElementSibling;
  body.classList.toggle('open');
  header.querySelector('span:last-child').textContent =
    body.classList.contains('open') ? '▾' : '▸';
};

// ======================== 日志读取 ========================
async function fetchLog() {
  try {
    const { stdout } = await exec(`tail -${LOG_TAIL} '${LOG_PATH}' 2>/dev/null || echo '日志文件不可用'`);
    logContent.textContent = stdout || '(空)';
    if (logAutoScroll) {
      logContent.scrollTop = logContent.scrollHeight;
    }
  } catch (e) {
    // 静默
  }
}

// ======================== 全屏日志 ========================
window.toggleLogFullscreen = function() {
  logFullscreen = !logFullscreen;
  logPanel.classList.toggle('fullscreen', logFullscreen);
  document.getElementById('fullscreenBtn').textContent = logFullscreen ? '✕ 关闭' : '⛶ 全屏';
  if (logFullscreen) {
    logAutoScroll = true;
    setTimeout(() => { logContent.scrollTop = logContent.scrollHeight; }, 100);
  }
};

// ======================== 运行状态读取 ========================
async function fetchStatus() {
  try {
    const { stdout } = await exec(`head -5 '${CONFIG_PATH.replace('profile.conf','tempctrl.status')}' 2>/dev/null || echo 'status 不可用'`);
    headerSub.textContent = stdout.split('\n')[0] || '运行中';
  } catch (e) {
    // 静默
  }
}

// ======================== 启动 ========================
async function init() {
  setStatus('加载配置...');
  const vals = await readConfig();
  renderConfig(vals);

  // 初始展开所有
  document.querySelectorAll('.section-body').forEach(b => b.classList.add('open'));
  document.querySelectorAll('.section-header span:last-child').forEach(s => { s.textContent = '▾'; });

  setStatus('就绪', 'ok');

  // 日志轮询
  await fetchLog();
  setInterval(fetchLog, POLL_LOG_MS);

  // 状态轮询
  setInterval(fetchStatus, POLL_CONFIG_MS);
}

init().catch(e => {
  setStatus('初始化失败: ' + e.message, 'error');
});
</script>
</body>
</html>
